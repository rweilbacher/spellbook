<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#101216">
<title>Spellbook</title>
<style>
:root{
  --void:#101216; --slate:#191c22; --raise:#22262e; --line:#2c313a;
  --ink:#e6e1d7; --muted:#8a8f9a; --dim:#5f646e;
  --brass:#c4a05a; --brass-dim:#7a6336; --brass-glow:rgba(196,160,90,.16);
  --serif:Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --pad:20px;
  --tabh:58px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{
  background:var(--void); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.5;
  padding-top:env(safe-area-inset-top);
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit;background:var(--slate);border:1px solid var(--line);
  border-radius:10px;padding:11px 13px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--brass-dim)}
textarea{resize:vertical;min-height:120px;font-family:var(--serif);font-size:17px;line-height:1.5}
::placeholder{color:var(--dim)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* ---------- shell ---------- */
#app{height:100%;display:flex;flex-direction:column;overflow:hidden}
.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:0 var(--pad) calc(var(--tabh) + env(safe-area-inset-bottom) + 24px)}
.screen.center{display:flex;flex-direction:column;padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom))}
.hide{display:none !important}

.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
  font-weight:600}
.hdr{padding:22px 0 14px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.hdr h1{font-family:var(--serif);font-size:25px;font-weight:400;margin:0;letter-spacing:.01em}
.count{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}

/* ---------- tabs ---------- */
nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--tabh) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(16,18,22,.94);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:flex;z-index:40}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--dim);font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;
  transition:color .18s}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.4;
  stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--brass)}

/* ---------- draw ---------- */
#draw{position:relative;display:flex;flex-direction:column}
.altar{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;width:100%;
  gap:26px;padding:12px 0;order:2;transition:gap .35s}
.sigil-wrap{position:relative;width:190px;height:190px;display:grid;place-items:center;
  transition:width .4s cubic-bezier(.3,.7,.3,1),height .4s cubic-bezier(.3,.7,.3,1),
             transform .5s cubic-bezier(.4,0,.2,1),opacity .45s}

/* after a cast: the spell takes the room, the sigil becomes a footer mark */
#draw.revealed .altar{flex:0 0 auto;flex-direction:row;gap:13px;padding:11px 0 4px;
  border-top:1px solid var(--line);order:3}
#draw.revealed .sigil-wrap{width:38px;height:38px}
#draw.revealed .cast-label{font-size:10px;letter-spacing:.18em;text-align:left;min-height:0}
#draw.revealed .results{display:flex;order:2;flex:1;min-height:0;overflow-y:auto;
  -webkit-overflow-scrolling:touch;padding:4px 0 14px}
#draw.revealed .results>.inner{margin:auto 0;display:flex;flex-direction:column;gap:14px;width:100%}
#draw.revealed .pulse{animation:none;opacity:.8}
#draw.revealed .halo,#draw.revealed .rot-slow,#draw.revealed .rot-back{opacity:0;transition:opacity .3s}
.sigil{width:100%;height:100%;overflow:visible}
.sigil .st{fill:none;stroke:var(--brass);stroke-linecap:round;vector-effect:non-scaling-stroke}
.sigil .halo{stroke:var(--brass);opacity:.055}
#sigilBtn{position:absolute;inset:-14px;border-radius:50%}
.rot-slow{transform-origin:50% 50%;animation:spin 64s linear infinite}
.rot-back{transform-origin:50% 50%;animation:spin 92s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.sigil-wrap.casting .rot-slow{animation-duration:1.6s}
.sigil-wrap.casting .rot-back{animation-duration:2.2s}
.sigil-wrap.casting{transform:scale(.9)}
.sigil-wrap.spent{transform:scale(.62);opacity:0;pointer-events:none}
.pulse{animation:pulse 4.5s ease-in-out infinite}
.sigil-wrap.denied{animation:nudge .4s}
@keyframes nudge{20%{transform:translateX(-3px)}45%{transform:translateX(3px)}70%{transform:translateX(-2px)}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.cast-label{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);
  font-weight:600;transition:color .3s;text-align:center;min-height:16px}
.cast-label.ready{color:var(--brass-dim)}

/* recharge ring */
.recharge{--circ:490.1;--cool:6000ms;stroke:var(--brass);stroke-width:1.6;fill:none;opacity:.9;
  stroke-dasharray:var(--circ);stroke-dashoffset:var(--circ);transform:rotate(-90deg);transform-origin:50% 50%}
.recharge.run{animation:draw-ring var(--cool) linear forwards}
@keyframes draw-ring{to{stroke-dashoffset:0}}

/* ---------- spell card ---------- */
.results{width:100%;display:none;flex-direction:column;gap:14px;padding:8px 0 4px}
.card{background:var(--slate);border:1px solid var(--line);border-radius:15px;
  padding:20px 19px 13px;position:relative;overflow:hidden}
.card.rise{animation:rise .55s cubic-bezier(.2,.7,.3,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;
  background:linear-gradient(180deg,var(--brass),transparent 85%);opacity:.55}
.spell{font-family:var(--serif);font-size:19.5px;line-height:1.48;white-space:pre-wrap;
  word-break:break-word;margin:0 0 14px;letter-spacing:.004em}
.spell.lg{font-size:22px}
.spell.sm{font-size:17px;line-height:1.55}
.spell b{font-weight:700;color:#f2eee6}
.spell em{font-style:italic}
.spell .mk{color:var(--brass);font-style:normal}

.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tag{font-size:11px;letter-spacing:.07em;padding:3.5px 9px;border-radius:999px;
  border:1px solid var(--line);color:var(--muted);background:#00000022}
.tag.brass{color:var(--brass);border-color:var(--brass-dim)}
button.tag:active{border-color:var(--brass-dim)}

.actions{display:flex;align-items:center;gap:4px;border-top:1px solid var(--line);
  padding-top:9px;margin-top:2px}
.act{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:9px;
  color:var(--dim);font-size:12.5px;letter-spacing:.02em;transition:color .15s,background .15s}
.act svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round}
.act:active{background:#ffffff0a}
.act.on{color:var(--brass)}
.act.on svg{fill:var(--brass-glow)}
.act .n{font-variant-numeric:tabular-nums}
.act.right{margin-left:auto}

.source{border-top:1px solid var(--line);margin-top:9px;padding-top:11px;
  font-size:12.5px;color:var(--muted);line-height:1.65}
.source div{display:flex;gap:9px}
.source dt{color:var(--dim);min-width:64px;flex-shrink:0}
.source a{color:var(--brass);word-break:break-all}

/* ---------- notes thread ---------- */
.notes{display:flex;flex-direction:column}
.note{padding:12px 0;border-bottom:1px solid var(--line)}
.note:first-child{padding-top:0}
.note:last-child{border-bottom:none}
.note-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:5px}
.note-meta span{font-size:11px;color:var(--dim);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.note-del{color:var(--dim);padding:4px}
.note-del svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round}
.note-del:active{color:#c47a68}
.note-text{margin:0;font-size:14.5px;line-height:1.6;color:var(--ink);white-space:pre-wrap;word-break:break-word}
.note-empty{color:var(--dim);font-size:13px;line-height:1.6;margin:0}

/* ---------- filter bar ---------- */
.filterbar{position:sticky;top:0;z-index:5;background:linear-gradient(var(--void) 72%,transparent);
  padding:12px 0 10px;display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none}
.filterbar::-webkit-scrollbar{display:none}
.chip{font-size:12px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);
  color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:7px;flex-shrink:0}
.chip.on{border-color:var(--brass-dim);color:var(--brass)}
.chip svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round}

/* ---------- lists ---------- */
.row{width:100%;text-align:left;padding:15px 2px;border-bottom:1px solid var(--line);display:block}
.row:last-child{border-bottom:none}
.row .t{font-family:var(--serif);font-size:16.5px;line-height:1.42;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  white-space:pre-wrap;margin-bottom:7px}
.row .m{display:flex;gap:9px;align-items:center;font-size:11px;color:var(--dim);flex-wrap:wrap}
.row .m .mt{color:var(--muted)}
.row.gone .t{color:var(--dim)}
.hit{color:var(--brass);background:var(--brass-glow);border-radius:2px}

.taggrid{display:flex;flex-wrap:wrap;gap:9px;padding:6px 0 20px}
.tagbtn{border:1px solid var(--line);border-radius:11px;padding:11px 14px;background:var(--slate);
  display:flex;align-items:baseline;gap:9px;min-width:0}
.tagbtn .nm{font-size:14px}
.tagbtn .ct{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.tagbtn.struct .nm{color:var(--brass)}

.factlist{padding:6px 0 20px}
.factitem{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:9px 10px 9px 14px;background:var(--slate);border:1px solid var(--line);
  border-radius:11px;margin-bottom:8px}
.factitem .nm{font-size:14px}
.factitem .ct{font-size:11.5px;color:var(--dim);margin-left:8px;font-variant-numeric:tabular-nums}

.empty{text-align:center;color:var(--dim);padding:52px 20px;font-size:14px;line-height:1.7}
.empty b{display:block;font-family:var(--serif);font-size:19px;color:var(--muted);
  font-weight:400;margin-bottom:8px}

/* ---------- vault ---------- */
.group{margin:22px 0 0}
.group>.eyebrow{margin-bottom:10px;display:block}
.item{width:100%;display:flex;align-items:center;gap:13px;padding:15px 15px;background:var(--slate);
  border:1px solid var(--line);border-radius:12px;margin-bottom:9px;text-align:left}
.item svg{width:19px;height:19px;stroke:var(--brass);fill:none;stroke-width:1.4;
  stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.item .lab{flex:1;min-width:0}
.item .lab .s{display:block;font-size:12px;color:var(--dim);margin-top:2px;line-height:1.45}
.item .val{color:var(--muted);font-size:13px;flex-shrink:0}
.seg{display:flex;gap:6px;background:var(--void);border:1px solid var(--line);
  border-radius:9px;padding:3px}
.seg button{padding:5px 13px;border-radius:6px;font-size:13px;color:var(--muted);
  font-variant-numeric:tabular-nums}
.seg button.on{background:var(--raise);color:var(--brass)}

/* ---------- desk ---------- */
.desk-glow{position:relative}
.desk-glow::after{content:'';position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);width:280px;height:120px;pointer-events:none;z-index:-1;
  background:radial-gradient(ellipse at center, var(--brass-glow), transparent 72%);opacity:.9}
.desk-list{display:flex;flex-direction:column;gap:14px;padding:8px 0 4px}
.badge{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin:-4px 0 12px}
.badge.untested{color:var(--brass-dim)}
.card.decaying{opacity:.58;filter:saturate(.5) sepia(.15)}
.card.decaying::before{background:linear-gradient(180deg,var(--brass-dim),transparent 85%);opacity:.4}
.card.decaying .badge{color:var(--brass-dim)}
.decay-divider{display:flex;align-items:center;gap:10px;margin:26px 0 14px;color:var(--dim)}
.decay-divider::before,.decay-divider::after{content:'';flex:1;height:1px;background:var(--line)}
.decay-divider span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.act.pinned{animation:pin .45s cubic-bezier(.3,1.4,.4,1)}
@keyframes pin{0%{transform:scale(1)}45%{transform:scale(1.3)}100%{transform:scale(1)}}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:#080a0ccc;backdrop-filter:blur(3px);z-index:50;
  animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--slate);
  border-top:1px solid var(--line);border-radius:19px 19px 0 0;
  max-height:90vh;display:flex;flex-direction:column;
  animation:up .3s cubic-bezier(.2,.8,.3,1);padding-bottom:env(safe-area-inset-bottom)}
@keyframes up{from{transform:translateY(100%)}}
.sheet .grab{width:34px;height:4px;border-radius:2px;background:var(--line);margin:9px auto 2px;flex-shrink:0}
.sheet .body{overflow-y:auto;padding:12px 19px 22px}
.sheet .top{display:flex;align-items:center;justify-content:space-between;padding:8px 19px 2px;flex-shrink:0}
.sheet .top .eyebrow{color:var(--brass-dim)}
.btn{display:block;width:100%;text-align:center;padding:13px;border-radius:11px;
  background:var(--brass);color:#15120b;font-weight:650;font-size:15px;letter-spacing:.01em;margin-top:14px}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--muted);font-weight:500}
.btn.danger{background:none;border:1px solid #5c3630;color:#c47a68;font-weight:500}
.field{margin-top:15px}
.field label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);font-weight:600;margin-bottom:7px}
.help{font-size:12.5px;color:var(--dim);line-height:1.6;margin-top:9px}
.fmtbar{display:flex;gap:6px;margin-bottom:7px}
.fmtbar button{min-width:38px;padding:6px 11px;border:1px solid var(--line);border-radius:8px;
  background:var(--void);color:var(--muted);font-size:13.5px}
.fmtbar button:active{border-color:var(--brass-dim);color:var(--brass)}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 16px);}
#toast.high{bottom:auto;top:calc(env(safe-area-inset-top) + 16px);animation:toastHigh .25s}
@keyframes toastHigh{from{opacity:0;transform:translate(-50%,-10px)}}
#toast{
  background:var(--raise);border:1px solid var(--line);color:var(--ink);
  padding:10px 17px;border-radius:999px;font-size:13.5px;z-index:80;
  animation:toast .25s;box-shadow:0 8px 26px #0009;max-width:88vw;text-align:center}
@keyframes toast{from{opacity:0;transform:translate(-50%,10px)}}

/* ---------- triage ---------- */
.triage-bar{display:flex;gap:9px;margin-top:16px}
.triage-bar button{flex:1;padding:13px 8px;border-radius:11px;border:1px solid var(--line);
  font-size:13.5px;color:var(--muted);background:var(--slate)}
.triage-bar button.keep{border-color:var(--brass-dim);color:var(--brass)}
.progress{height:2px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:14px}
.progress i{display:block;height:100%;background:var(--brass);transition:width .3s}

.banner{background:#20242c;border:1px solid var(--line);border-left:2px solid var(--brass-dim);
  border-radius:0 9px 9px 0;padding:11px 14px;font-size:12.5px;color:var(--muted);
  line-height:1.55;margin:14px 0 0}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s !important;transition-duration:.001s !important}
  .recharge.run{animation-duration:var(--cool) !important}
}
</style>
</head>
<body>
<div id="app">
  <!-- ============ DRAW ============ -->
  <section class="screen center" id="draw">
    <div class="filterbar" id="filterbar"></div>
    <div class="altar" id="altar">
      <div class="sigil-wrap" id="sigilWrap">
        <svg class="sigil" viewBox="0 0 200 200" aria-hidden="true">
          <circle class="st halo" cx="100" cy="100" r="92" stroke-width="10"/>
          <circle class="st" cx="100" cy="100" r="78" stroke-width="1" opacity=".45"/>
          <g class="rot-slow">
            <circle class="st" cx="100" cy="100" r="66" stroke-width="1.2" stroke-dasharray="1 7" opacity=".8"/>
            <path class="st" d="M100 34 L157 133 L43 133 Z" stroke-width="1.1" opacity=".55"/>
          </g>
          <g class="rot-back">
            <path class="st" d="M100 166 L43 67 L157 67 Z" stroke-width="1.1" opacity=".55"/>
            <circle class="st" cx="100" cy="100" r="52" stroke-width=".9" opacity=".4"/>
          </g>
          <circle class="st pulse" cx="100" cy="100" r="7" stroke-width="1.3"/>
          <circle class="st pulse" cx="100" cy="100" r="2.2" stroke-width="3" opacity=".9"/>
          <circle class="recharge" id="recharge" cx="100" cy="100" r="78"/>
        </svg>
        <button id="sigilBtn" aria-label="Cast"></button>
      </div>
      <div class="cast-label ready" id="castLabel">touch to cast</div>
    </div>
    <div class="results" id="results"></div>
  </section>

  <!-- ============ DESK ============ -->
  <section class="screen hide" id="desk">
    <div class="hdr desk-glow"><h1>The desk</h1><span class="count" id="deskCount"></span></div>
    <div id="deskBody"></div>
  </section>

  <!-- ============ LIBRARY ============ -->
  <section class="screen hide" id="library">
    <div class="hdr"><h1 id="libTitle">The book</h1><span class="count" id="libCount"></span></div>
    <input id="search" placeholder="Search the book" autocomplete="off" spellcheck="false">
    <div class="filterbar" id="libFilter"></div>
    <div id="libList"></div>
  </section>

  <!-- ============ TAGS ============ -->
  <section class="screen hide" id="tags">
    <div class="hdr"><h1>Tags</h1>
      <button class="chip" id="tagEdit" style="padding:6px 12px">Edit</button></div>
    <div class="count" id="tagCount" style="padding-bottom:8px"></div>
    <div class="taggrid" id="tagGrid"></div>
  </section>

  <!-- ============ VAULT ============ -->
  <section class="screen hide" id="vault">
    <div class="hdr"><h1>Vault</h1></div>
    <div id="vaultBody"></div>
  </section>

  <nav>
    <button data-tab="draw" class="on">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></svg>Draw</button>
    <button data-tab="desk">
      <svg viewBox="0 0 24 24"><path d="M8 9L10 4h4l2 5z"/><path d="M12 9v8"/><path d="M8 20h8"/></svg>Desk</button>
    <button data-tab="library">
      <svg viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 015.5 4H10v16H5.5A1.5 1.5 0 014 18.5z"/><path d="M20 5.5A1.5 1.5 0 0018.5 4H14v16h4.5a1.5 1.5 0 001.5-1.5z"/></svg>Book</button>
    <button data-tab="tags">
      <svg viewBox="0 0 24 24"><path d="M3 12V5a2 2 0 012-2h7l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.3"/></svg>Tags</button>
    <button data-tab="vault">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="12" cy="12" r="3.6"/><path d="M12 4v2M12 18v2"/></svg>Vault</button>
  </nav>
</div>

<script>
/* =========================================================================
   Storage — the Android bridge is the real one. In a plain browser we keep
   state in memory so the app is fully explorable, just not persistent.
   ========================================================================= */
const Bridge = window.Android && typeof window.Android.save === 'function' ? window.Android : null;
let memory = null;

const Store = {
  load(){
    try{
      const raw = Bridge ? Bridge.load() : memory;
      return raw ? (typeof raw === 'string' ? JSON.parse(raw) : raw) : null;
    }catch(e){ console.warn('load failed', e); return null; }
  },
  save(doc){
    const raw = JSON.stringify(doc);
    if(Bridge) { try { Bridge.save(raw); } catch(e){ console.warn('save failed', e); } }
    else memory = raw;
  }
};

idian","note":"2025-09-07 Sun","file":"1 - daily notes/2025/2025 fools valley/2025-09-07 Sun.md","line":106,"url":null,"capturedAt":"2025-09-07"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T08:56:42+00:00"},{"id":"sp_bb04e912","text":"is there a place in the world I would like to be more right now?","tags":["flat","wanting"],"source":{"origin":"obsidian","note":"2025-01-20 Mon","file":"1 - daily notes/2025/2025-01/2025-01-20 Mon.md","line":1,"url":null,"capturedAt":"2025-01-20"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T08:56:42+00:00"},{"id":"sp_8f21f57b","text":"Look through the representations not at them","tags":["in-my-head"],"source":{"origin":"obsidian","note":"2025-01-20 Mon","file":"1 - daily notes/2025/2025-01/2025-01-20 Mon.md","line":3,"url":null,"capturedAt":"2025-01-20"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T08:56:42+00:00"},{"id":"sp_05e1d2a9","text":"feeling is healing","tags":["in-my-head","overwhelmed"],"source":{"origin":"obsidian","note":"2025-01-20 Mon","file":"1 - daily notes/2025/2025-01/2025-01-20 Mon.md","line":5,"url":null,"capturedAt":"2025-01-20"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T08:56:42+00:00"},{"id":"sp_8fc9bc44","text":"==Allow yourself to be seen==\n==Reach for the things you want==\n==Allow yourself to be seen for wanting them==","tags":["avoiding","wanting"],"source":{"origin":"obsidian","note":"2025-02-10 Mon","file":"1 - daily notes/2025/2025-02/2025-02-10 Mon.md","line":90,"url":null,"capturedAt":"2025-02-10"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T08:56:42+00:00"},{"id":"sp_2fbada89","text":"all tension is generative","tags":["overwhelm :38+00:00","updatedAt":"2026-08-27T08:56:42+00:00"},{"id":"sp_8274daa4","text":"where does my energy come from? What is its source?","tags":["flat","prompt"],"source":{"origin":"obsidian","note":"2025-03-08 Sat","file":"1 - daily notes/2025/2025-03/2025-03-08 Sat.md","line":22,"url":null,"capturedAt":"2025-03-08"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T08:56:42+00:00"},{"id":"sp_b8f08ca1","text":"That sense of the golden line of light guiding me out of the darkness has greatly diminished. Bring it back.\nFuck it. Have sex with it. Ejaculate in it. Play with it.\nThe perceptual distance has grown. The target appears smaller. The path less vital. Strengthen it anyway. See how it all brings you closer to the light. The eyes of friends. Love. Community.\nConstellate it (even if it's a weak version, the principles appear roughly the same).\nMy purpose must bring me closer to this!","tags":["flat"],"source":{"origin":"obsidian","note":"2025-03-09 Sun","file":"1 - daily notes/2025/2025-03/2025-03-09 Sun.md","line":1,"url":null,"capturedAt":"2025-03-09"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T08:56:42+00:00"},{"id":"sp_63bb1de8","text":"how can you make going to the meta-level a yes and move?","tags":["among-people"],"source":{"origin":"obsidian","note":"2025-03-15 Sat","file":"1 - daily notes/2025/2025-03/2025-03-15 Sat.md","line":37,"url":null,"capturedAt":"2025-03-15"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T08:56:42+00:00"},{"id":"sp_e53f79ed","text":"\"I often don't know things until someone asks me a question\"","tags":["disconnected","stuck"],"source":{"origin":"obsidian","note":"2025-03-28 Fri","file":"1 - daily notes/2025/2025-03/2025-03-28 Fri.md","line":20,"url":null,"capturedAt":"2025-03-28"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T08:56:42+00:00"},{"id":"sp_13aa17e1","text":"drop into your body. Listen to it. Let it comfort the mind. It knows how safe you actually are. It matters not what is there but what you feed energy","tags":["in-my-head","spiralling"],"source":{"origin":"obsidian","note":"2025-04-09 Wed","file":"1 - daily notes/2025/2025-04/2025-04-09 Wed.md","line":48,"url":null,"capturedAt":"2025-04-09"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T08:56:42+00:00"},{"id":"sp_fbf6b06d","text":"admit overwhelm. Feel the overwhelm. What does the overwhelm give me? It's related to the capacity for pleasure","tags":["overwhelmed"],"source":{"origin":"obsidian","note":"2025-04-09 Wed","file":"1 - daily notes/2025/2025-04/2025-04-09 Wed.md","line":53,"url":null,"capturedAt":"2025-04-09"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T08:56:42+00:00"},{"id":"sp_d206ba0c","text":"I can have a need even when others are in a process. Being punished for expressing needs","tags":["wanting","with-her"],"source":{"origin":"obsidian","note":"2025-04-11 Fri","file":"1 - daily notes/2025/2025-04/2025-04-11 Fri.md","line":5,"url":null,"capturedAt":"2025-04-11"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T08:56:42+00:00"},{"id":"sp_3cc6b314","text":"the punch is in the fear\nlove is scaffolding for fear\nif the fear disappears theres no motion","tags":["afraid"],"source":{"origin":"obsidian","note":"2025-04-14 Mon","file":"1 - daily notes/2025/2025-04/2025-04-14 Mon.md","line":47,"url":null,"capturedAt":"2025-04-14"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T08:56:42+00:00"},{"id":"sp_375ef399","text":"\"what if I pretended I was yway. You don't need to ask for help. You can just casually reach out. And the reason can still be that you feel those ways. Maybe it'll come up maybe it won't. Maybe it surfaces that you do need more help, maybe a simple message fixes it. You can even reach out to many people.\nYour friends love you and they will understand. They want and need you to feel good and connected. They will support you in taking the challenging steps of overcoming your patterns.","tags":["afraid","disconnected"],"source":{"origin":"obsidian","note":"2025-04-19 Sat","file":"1 - daily notes/2025/2025-04/2025-04-19 Sat.md","line":17,"url":null,"capturedAt":"2025-04-19"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T08:56:42+00:00"},{"id":"sp_7bf5cfd6","text":"I want to destroy\nI want to be comfortable with the destruction inherent in creation.\nI want to trust my creation and destruction","tags":["stuck"],"source":{"origin":"obsidian","note":"2025-04-26 Sat","file":"1 - daily notes/2025/2025-04/2025-04-26 Sat.md","line":156,"url":null,"capturedAt":"2025-04-26"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T08:56:42+00:00"},{"id":"sp_8983c10b","text":"das Leben schätzen lernen. Ich weiß so viel noch nicht zu schätzen","tags":["flat"],"source":{"origin":"obsidian","note":"2025-04-30 Wed","file":"1 - daily notes/2025/2025-04/2025-04-30 Wed.md","line":12,"url":null,"capturedAt":"2025-04-30"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T08:56:42+00:00"},{"id":"sp_0fb769d6","text":"readiness is a feeling that follows action not the other way around","tags":["avoiding","stuck"],"source":{"origin":"obsidian","note":"2025-05-06 Tue","file":"1 - daily notes/2025/2025-05/2025-05-06 Tue.md","line":1,"url":null,"capturedAt":"2025-05-06"},"useful":0,"drawn":0,"lastDrawn":null,"state":"ac 3-10 Tue.md","line":9,"url":null,"capturedAt":"2026-03-10"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T08:56:42+00:00"},{"id":"sp_3353fcfd","text":"what do you need to feel safe in this moment? What conditions would make it easier to move forward?","tags":["afraid","stuck"],"source":{"origin":"obsidian","note":"2026-03-16 Mon - computer","file":"1 - daily notes/2026-03/2026-03-16 Mon - computer.md","line":71,"url":null,"capturedAt":"2026-03-16"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T08:56:42+00:00"},{"id":"sp_e04bc7b4","text":"don't take people for granted. don't take things for granted","tags":["flat","with-her"],"source":{"origin":"obsidian","note":"2026-03-19 Thu","file":"1 - daily notes/2026-03/2026-03-19 Thu.md","line":1,"url":null,"capturedAt":"2026-03-19"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T08:56:42+00:00"},{"id":"sp_efa3ee03","text":"**Setup** (1 minute): Sit comfortably, close your eyes, and take a few normal breaths to arrive. Set a gentle intention, something like “I’m preparing my body and mind to settle.”\n**Connected breathing** (3 to 5 minutes): Begin breathing in a connected rhythm with no pause between inhale and exhale, so the breath becomes one continuous circle. Breathe through the mouth, in and out, at a pace that feels active but sustainable. The inhale is active and full (into the belly, then chest), the exhale is a relaxed release. You’re not pushing air out, just letting it fall. After a couple of minutes, you’ll likely start to feel tingling, warmth, or a shift in body awareness. That’s the signal you’re dropping in.\n**Transition** (2 to 3 minutes): Slow the rhythm down gradually. Shift from mouth breathing to nose breathing. Start extending your exhales, aiming for roughly double the length of the inhale. If you’re inhaling for 4 counts, exhale for 7 or 8. Let each exhale carry a sense of softening in the jaw, shoulders, belly, and pelvic floor.","tags":["overwhelmed","practice"],"source":{"origin":"obsidian","note":"2026-04-01 Wed","file":"1 - daily notes/2026-04-01 Wed.md","line":5,"url":null,"capturedAt":"2026-04-01"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T08:56:42+00:00"},{"id":"sp_0f18541a","text":"connect with my strengths. Strengthen that which is good and widen it. The capacities of my self","tags":["flat","self-attacking"],"source":{"origin":"obsidian","note":"2026-04-07 Tue","file":"1 - daily notes/2026-04-07 Tue.md","line":12,"url":null,"capturedAt":"2026-04-07"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T08:56:42+00:00"},{"id":"sp_e0e9bdc4","text":"**find people that are doing something that I want to do**\n**and them showing me how to do that**\n**strengthening my inner strength and capacities**\n**while following my desires**","tags":["disconnected","stuck"],"source":{"origin":"obsidian","note":"2026-04-15 Wed - computer","file":"1 - daily notes/2026-04-15 Wed - computer.md","line":25,"url":null,"capturedAt":"2026-04-15"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T08:56:42+00:00"},{"id":"sp_f3c7c8ad","text":"**slow down**\n**slow down**\n**slow down**\nit's happening\nyou just gotta stay with it\nslow is smooth\nsmooth is fast","tags":["overwhelmed","rushing"],"source":{"origin":"obsidian","note":"2026-04-15 Wed - computer","file":"1 - daily notes/2026-04-15 Wed - computer.md","line":49,"url":null,"capturedAt":"2026-04-15"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T08:56:42+00:00"},{"id":"sp_ca281209","text":"wie verfügbar fühlt sich Tanz an ist ein gutes Barometer","tags":["arriving"],"source":{"origin":"obsidian","note":"2026-04-16 Thu","file":"1 - daily notes/2026-04-16 Thu.md","line":9,"url":null,"capturedAt":"2026-04-16"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T08:56:42+00:00"},{"id":"sp_d76315a7","text":"You are not responsible for resourcing yourself alone. But you are responsible for being honest about the resources you need and where you get them from.","tags":["disconnected","with-her"],"source":{"origin":"obsidian","note":"2026-05-15 Fri","file":"1 - daily notes/2026-05-15 Fri.md","line":9,"url":null,"capturedAt":"2026-05-15"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T08:56:42+00:00"},{"id":"sp_ba787399","text":"new choice importantly maintains spontaneity. It doesn't try to enforce a particular choice. Even if one is naturally close at hand","tags":[],"source":{"origin":"obsidian","note":"2026-05-20 Wed","file":"1 - daily notes/2026-05-20 Wed.md","line":11,"url":null,"capturedAt":"2026-05-20"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T08:56:42+00:00"},{"id":"sp_d186fdbe","text":"affirm: all is well, everything is working out for my highest good, out of this experience only good will come, i am safe","tags":["afraid","practice"],"source":{"origin":"obsidian","note":"2026-05-25","file":"1 - daily notes/2026-05-25.md","line":5,"url":null,"capturedAt":"2026-05-25"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T08:56:42+00:00"},{"id":"sp_92c546c0","text":"What if it was easy to be happy?","tags":["flat","self-attacking"],"source":{"origin":"obsidian","note":"2026-06-23 Tue","file":"1 - daily notes/2026-06-23 Tue.md","line":17,"url":null,"capturedAt":"2026-06-23"},"useful":0,"drawn":0,"lastDrawn":null const DEFAULTS = { drawCount:1, include:[], require:[], exclude:[], noRepeat:12, sort:'recent',
  inboxWeight:3, flaggedWeight:1, tagKindOverrides:{} };
const SITUATIONS = ['spiralling','stuck','avoiding','defending','disconnected','overwhelmed',
  'afraid','self-attacking','in-my-head','flat','rushing','wanting','with-her','among-people','arriving'];
const INBOX = 'inbox';
const FLAGGED = 'flagged';           // formerly 'needs-review' — see migrateFlagTag
const FORM = ['practice','prompt',FLAGGED,INBOX];
const STRUCTURAL = ['question','untagged','useful'];   // computed, never stored
const PROTECTED = [FLAGGED];         // authored tags the tag manager won't rename or remove

/* Two kinds of tag, two kinds of filter. Situations (plus 'untagged', the
   unsituated state) describe where you are — pick any that apply, OR'd
   together. Everything else describes what the spell is — each one gets
   its own Require (must have) / Never (must not have), AND'd together.
   Membership defaults to the SITUATIONS list, but is toggleable per tag
   (see manageTag) and stored as an override once it diverges from that
   default, so new tags keep working without needing an entry here. */
function isSituationLike(t){
  if(t === 'untagged') return true;
  const overrides = S && S.tagKindOverrides;
  if(overrides && Object.prototype.hasOwnProperty.call(overrides, t)) return overrides[t] === 'situation';
  return SITUATIONS.includes(t);
}

/* A tag lights up on a card only if it's part of what you've actively
   filtered for right now — not just because it happens to be a situation.
   Keeps 'brass' meaning one thing: this is why the spell is in front of you. */
function isActiveFilter(t){ return S.include.includes(t) || S.require.includes(t); }

/* Derived from the text as it is right now, so an edit can't leave them lying. */
function computed(s){
  const out = [];
  if(s.text.includes('?')) out.push('question');
  if(!s.tags.some(t => isSituationLike(t))) out.push('untagged');
  if(s.useful > 0) out.push('useful');
  return out;
}
/* Stored tags plus computed ones — what the app shows and filters on. */
function tagsOf(s){ return [...s.tags, ...computed(s)]; }

/* The desk — a short-term working set, deliberately placed there by a card
   quick-action, never derived from the draw. Decay is computed from the
   stored timestamp every time it's needed, so nothing needs a cleanup job. */
const DESK_DAYS = 3;      // days shown as fresh, on the desk
const DECAY_DAYS = 3;     // extra days lingering, fading, before it's gone
const DAY_MS = 24*60*60*1000;

function deskState(s){
  if(!s.desked) return null;
  const age = Date.now() - new Date(s.desked).getTime();
  if(age < DESK_DAYS*DAY_MS) return 'desk';
  if(age < (DESK_DAYS+DECAY_DAYS)*DAY_MS) return 'decaying';
  return null;
}
function deskList(){ return active().filter(s => deskState(s)==='desk').sort((a,b)=>new Date(b.desked)-new Date(a.desked)); }
function decayList(){ return active().filter(s => deskState(s)==='decaying').sort((a,b)=>new Date(b.desked)-new Date(a.desked)); }
function deskAgeLabel(s){
  const days = Math.floor((Date.now()-new Date(s.desked).getTime())/DAY_MS);
  if(days<=0) return 'placed today';
  if(days===1) return 'placed yesterday';
  return `placed ${days} days ago`;
}
function decayLabel(s){
  const days = Math.floor((Date.now()-new Date(s.desked).getTime())/DAY_MS);
  const left = Math.max(1, DESK_DAYS+DECAY_DAYS-days);
  return `fading — gone in ${left===1?'a day':left+' days'}`;
}

let doc, S;           // document + settings
let recent = [];      // ids drawn recently (no-repeat window)
let cooling = false;
const COOL_MS = 6000;

function boot(){
  doc = Store.load();
  if(!doc || !Array.isArray(doc.spells) || !doc.spells.length){
    doc = { version:1, exportedAt:new Date().toISOString(), settings:{...DEFAULTS}, spells:SEED.map(s=>({...s})) };
    Store.save(doc);
  }
  doc.settings = Object.assign({}, DEFAULTS, doc.settings || {});
  S = doc.settings;
  if(!Array.isArray(S.require)) S.require = [];
  if(!S.tagKindOverrides || typeof S.tagKindOverrides !== 'object') S.tagKindOverrides = {};
  migrateFlagTag();
  migrateFilterSchema();
  migrateDeskField();
  migrateInboxTag();
  migrateNotesField();
  renderAll();
}

/* One-time migration: the old filter sheet let any tag cycle through
   require/banish, situations included. Now situations only ever get
   selected (S.include, OR'd), and everything else is Require (S.require,
   AND'd) or Never (S.exclude). Split existing settings into that shape. */
function migrateFilterSchema(){
  let changed = false;
  const movedToRequire = S.include.filter(t => !isSituationLike(t));
  if(movedToRequire.length){
    S.require = [...new Set([...S.require, ...movedToRequire])];
    S.include = S.include.filter(t => isSituationLike(t));
    changed = true;
  }
  if(S.exclude.some(isSituationLike)){
    S.exclude = S.exclude.filter(t => !isSituationLike(t));
    changed = true;
  }
  if(changed) persist();
}

/* One-time migration: two legacy names for the same thing fold into
   'flagged' — the old 'review' bookmark quick-action, and 'needs-review'
   from before this rename. Dedupes if a spell somehow carries more than
   one, and follows sticky filters across. */
function migrateFlagTag(){
  let touched = false;
  const legacy = ['review', 'needs-review'];
  for(const s of doc.spells){
    if(s.tags.some(t => legacy.includes(t))){
      s.tags = [...new Set(s.tags.map(t => legacy.includes(t) ? FLAGGED : t))].sort();
      touched = true;
    }
  }
  for(const old of legacy){
    if(S.include.includes(old) && !S.include.includes(FLAGGED)) S.include.push(FLAGGED);
    if(S.exclude.includes(old) && !S.exclude.includes(FLAGGED)) S.exclude.push(FLAGGED);
  }
  const before = S.include.length + S.exclude.length;
  S.include = S.include.filter(t => !legacy.includes(t));
  S.exclude = S.exclude.filter(t => !legacy.includes(t));
  if(touched || S.include.length + S.exclude.length !== before) persist();
}

/* One-time migration: older spells (and the seed) predate the desk field
   entirely. Give every spell an explicit null so deskState() always has
   something to read. */
function migrateDeskField(){
  let touched = false;
  for(const s of doc.spells){ if(s.desked === undefined){ s.desked = null; touched = true; } }
  if(touched) persist();
}

/* One-time migration: the inbox is new. Every spell already in the book
   enters it retroactively — same rule a spell gets from here on — unless
   it's already proven useful. Gated on a doc-level flag rather than tag
   presence, since a manually-removed inbox tag must not come back. */
function migrateInboxTag(){
  if(doc.inboxSeeded) return;
  for(const s of doc.spells){
    if(!(s.useful > 0) && !s.tags.includes('inbox')){
      s.tags = [...s.tags, 'inbox'].sort();
    }
  }
  doc.inboxSeeded = true;
  persist();   // always, even if nothing changed — the flag itself must be saved
}

/* One-time migration: notes are new. Give every spell an explicit empty
   thread so nothing downstream has to guard against a missing array.
   The shape is generic — { id, type, text, createdAt } — so a future
   'voice' type can land in the same slot, its audio in its own file with
   only the filename stored here, same as the rest of the book stays a
   plain JSON file. */
function migrateNotesField(){
  let touched = false;
  for(const s of doc.spells){ if(!Array.isArray(s.notes)){ s.notes = []; touched = true; } }
  if(touched) persist();
}
function persist(){
  doc.exportedAt = new Date().toISOString();
  Store.save(doc);
}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const active = () => doc.spells.filter(s => s.state === 'active');
const buried = () => doc.spells.filter(s => s.state === 'graveyard');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid = () => 'sp_' + Math.random().toString(16).slice(2,10);
const nid = () => 'nt_' + Math.random().toString(16).slice(2,10);
const now = () => new Date().toISOString();

function fmt(text){
  return esc(text)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/==(.+?)==/g, '<i class="mk">$1</i>');
}
function sizeClass(t){
  const n = t.replace(/[*=]/g,'').length;
  return n < 46 ? 'lg' : n > 300 ? 'sm' : '';
}
function toast(msg){
  const old = $('#toast'); if(old) old.remove();
  const el = document.createElement('div');
  el.id = 'toast'; el.textContent = msg;
  if(document.querySelector('.sheet')) el.classList.add('high');
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2100);
}
function buzz(ms){ if(navigator.vibrate) try{ navigator.vibrate(ms); }catch(e){} }

function allTags(){
  const c = new Map();
  for(const s of doc.spells){ if(s.state!=='active') continue;
    for(const t of tagsOf(s)) c.set(t, (c.get(t)||0)+1); }
  return [...c.entries()].sort((a,b)=> b[1]-a[1] || a[0].localeCompare(b[0]));
}

/* =========================================================================
   Drawing
   ========================================================================= */
/* The same sticky filters narrow the draw pool and the library list. */
/* extraRequire: an additional tag to require on top of the active filter,
   used to answer "how many would match if this were also Required?"
   without disturbing the real filter state. */
function matchesFilters(s, extraRequire){
  const t = tagsOf(s);
  if(S.include.length && !S.include.some(x => t.includes(x))) return false;
  const req = (extraRequire && !S.require.includes(extraRequire)) ? [...S.require, extraRequire] : S.require;
  if(req.length && !req.every(x => t.includes(x))) return false;
  if(S.exclude.length && S.exclude.some(x => t.includes(x))) return false;
  return true;
}
function pool(){
  return active().filter(matchesFilters);
}

/* How many active spells would be left if `t` were added to Require,
   on top of whatever's already selected. Powers the crossed-out counts
   in the Type & marks list. */
function requireCountWith(t){
  return active().filter(s => matchesFilters(s, t)).length;
}

/* Inbox spells are unproven, so they're over-represented in the draw
   rather than waiting their turn like everything else — tested while
   the reason they were written is still fresh. Flagged spells get their
   own dial too, independent of inbox — default 1 (no effect), but
   something like 0.8 quietly de-emphasises them without hiding them.
   Both are user settings (S.inboxWeight / S.flaggedWeight) and combine
   multiplicatively when a spell carries both tags. */
function weightOf(s){
  const t = tagsOf(s);
  let w = 1;
  if(t.includes(INBOX)) w *= (S.inboxWeight ?? DEFAULTS.inboxWeight);
  if(t.includes(FLAGGED)) w *= (S.flaggedWeight ?? DEFAULTS.flaggedWeight);
  return Math.max(0, w);
}
function inboxBadge(s){ return tagsOf(s).includes(INBOX) ? 'untested' : null; }
function weightedIndex(bag){
  const weights = bag.map(weightOf);
  const total = weights.reduce((a,b)=>a+b, 0);
  if(total <= 0) return Math.floor(Math.random() * bag.length);
  let r = Math.random() * total;
  for(let i = 0; i < bag.length; i++){
    r -= weights[i];
    if(r < 0) return i;
  }
  return bag.length - 1;
}
function pick(n){
  let p = pool();
  if(!p.length) return [];
  const fresh = p.filter(s => !recent.includes(s.id));
  if(fresh.length >= n) p = fresh;
  const out = [];
  const bag = p.slice();
  while(out.length < Math.min(n, bag.length + out.length) && bag.length){
    out.push(bag.splice(weightedIndex(bag), 1)[0]);
  }
  recent = [...out.map(s=>s.id), ...recent].slice(0, S.noRepeat);
  return out;
}

function cast(){
  if(cooling){
    const w = $('#sigilWrap');
    w.classList.remove('denied'); void w.offsetWidth; w.classList.add('denied');
    return;
  }
  const p = pool();
  if(!p.length){
    toast(active().length ? 'Nothing matches those filters' : 'The book is empty');
    return;
  }
  cooling = true;
  const wrap = $('#sigilWrap'), label = $('#castLabel'), res = $('#results'), scr = $('#draw');
  buzz(12);
  res.innerHTML = '';
  scr.classList.remove('revealed');
  wrap.classList.add('casting');
  label.classList.remove('ready');
  label.textContent = 'gathering';

  setTimeout(()=>{
    wrap.classList.add('spent');
    setTimeout(()=>{
      const drawn = pick(S.drawCount);
      for(const s of drawn){ s.drawn++; s.lastDrawn = now(); }
      persist();
      res.innerHTML = '<div class="inner">' + drawn.map((s,i)=>card(s,{delay:i*130, badge:inboxBadge(s), badgeClass:'untested'})).join('') + '</div>';
      wrap.classList.remove('casting','spent');
      scr.classList.add('revealed');
      res.scrollTop = 0;
      buzz(18);
      recharge();
    }, 420);
  }, 900);
}

function recharge(){
  const ring = $('#recharge'), label = $('#castLabel');
  label.textContent = 'reinscribing';
  ring.classList.remove('run'); void ring.offsetWidth; ring.classList.add('run');
  setTimeout(()=>{
    cooling = false;
    ring.classList.remove('run');
    label.textContent = 'cast again';
    label.classList.add('ready');
  }, COOL_MS);
}

/* =========================================================================
   Card rendering
   ========================================================================= */
function card(s, opt={}){
  const o = Object.assign({delay:0, from:'draw', open:false, decaying:false, badge:null, badgeClass:''}, opt);
  return `
  <article class="card${o.delay!==undefined?' rise':''}${o.decaying?' decaying':''}" style="animation-delay:${o.delay}ms" data-id="${s.id}">
    ${o.badge ? `<div class="badge${o.badgeClass?' '+o.badgeClass:''}">${esc(o.badge)}</div>` : ''}
    <p class="spell ${sizeClass(s.text)}">${fmt(s.text)}</p>
    ${tagsOf(s).length ? `<div class="tags">${tagsOf(s).map(t=>
      `<button class="tag${isActiveFilter(t)?' brass':''}" data-act="tag" data-tag="${esc(t)}">${esc(t)}</button>`).join('')}</div>` : ''}
    <div class="actions">
      <button class="act${s.useful?' on':''}" data-act="useful" aria-label="Mark useful">
        <svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.7-7.5-10a4.2 4.2 0 017.5-2.6A4.2 4.2 0 0119.5 10.5c0 5.3-7.5 10-7.5 10z"/></svg>
        ${s.useful ? `<span class="n">${s.useful}</span>` : ''}
      </button>
      <button class="act${s.tags.includes(FLAGGED)?' on':''}" data-act="flag" aria-label="Flag">
        <svg viewBox="0 0 24 24"><path d="M5 21V4"/><path d="M5 4h12l-3 4 3 4H5z"/></svg>
      </button>
      <button class="act${deskState(s)?' on':''}" data-act="desk" aria-label="Place on the desk">
        <svg viewBox="0 0 24 24"><path d="M8 9L10 4h4l2 5z"/><path d="M12 9v8"/><path d="M8 20h8"/></svg>
      </button>
      <button class="act${(s.notes&&s.notes.length)?' on':''}" data-act="note" aria-label="Add a note">
        <svg viewBox="0 0 24 24"><path d="M4 4.5h16v11H9l-4.5 4V4.5z"/><path d="M9 9h6M9 12.5h4"/></svg>
      </button>
      <button class="act" data-act="source" aria-label="Source">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
      </button>
      <button class="act right" data-act="bury" aria-label="Bury">
        <svg viewBox="0 0 24 24"><path d="M5 21V10a7 7 0 0114 0v11"/><path d="M12 21v-8M9 13h6"/></svg>
      </button>
    </div>
    <div class="source hide">${sourceHtml(s)}</div>
  </article>`;
}

function sourceHtml(s){
  const src = s.source || {};
  const rows = [];
  const origin = {obsidian:'Obsidian vault', manual:'Written here', import:'Imported'}[src.origin] || src.origin || 'unknown';
  rows.push(['Origin', esc(origin)]);
  if(src.capturedAt) rows.push(['Captured', esc(src.capturedAt)]);
  else if(src.note) rows.push(['Note', esc(src.note)]);
  if(src.note && src.capturedAt && !src.note.startsWith(src.capturedAt)) rows.push(['Note', esc(src.note)]);
  if(src.file) rows.push(['File', esc(src.file) + (src.line ? ':' + src.line : '')]);
  if(src.url) rows.push(['Link', `<a href="${esc(src.url)}" target="_blank" rel="noreferrer">${esc(src.url)}</a>`]);
  if(deskState(s)) rows.push(['Desk', esc(deskState(s)==='decaying' ? decayLabel(s) : deskAgeLabel(s))]);
  rows.push(['Drawn', s.drawn === 1 ? 'once' : s.drawn + ' times']);
  rows.push(['Useful', s.useful === 1 ? 'once' : s.useful + ' times']);
  if(s.notes && s.notes.length) rows.push(['Notes', s.notes.length === 1 ? '1 note' : s.notes.length + ' notes']);
  return rows.map(([k,v])=>`<div><dt>${k}</dt><dd style="margin:0">${v}</dd></div>`).join('')
    + `<div style="margin-top:11px;gap:6px"><button class="tag" data-act="edit">edit spell</button></div>`;
}

/* card interactions (delegated) */
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if(!btn) return;
  const cardEl = btn.closest('.card');
  const act = btn.dataset.act;

  if(act === 'tag'){ openTag(btn.dataset.tag); return; }
  if(!cardEl) return;
  const s = doc.spells.find(x => x.id === cardEl.dataset.id);
  if(!s) return;

  if(act === 'useful'){
    s.useful++; s.updatedAt = now();
    const leftInbox = s.tags.includes('inbox');
    if(leftInbox) s.tags = s.tags.filter(t=>t!=='inbox');
    persist(); buzz(10);
    btn.classList.add('on');
    let n = btn.querySelector('.n');
    if(!n){ n = document.createElement('span'); n.className = 'n'; btn.appendChild(n); }
    n.textContent = s.useful;
    if(leftInbox){
      const box = cardEl.querySelector('.tags');
      if(box) box.outerHTML = `<div class="tags">${tagsOf(s).map(t=>
        `<button class="tag${isActiveFilter(t)?' brass':''}" data-act="tag" data-tag="${esc(t)}">${esc(t)}</button>`).join('')}</div>`;
      const badgeEl = cardEl.querySelector('.badge.untested');
      if(badgeEl) badgeEl.remove();
      toast('Marked useful — left the inbox');
    }
    refreshQuiet();
  }
  if(act === 'flag'){
    const on = s.tags.includes(FLAGGED);
    s.tags = on ? s.tags.filter(t=>t!==FLAGGED) : [...s.tags,FLAGGED].sort();
    s.updatedAt = now(); persist(); buzz(10);
    btn.classList.toggle('on', !on);
    const box = cardEl.querySelector('.tags');
    if(box) box.outerHTML = `<div class="tags">${tagsOf(s).map(t=>
      `<button class="tag${isActiveFilter(t)?' brass':''}" data-act="tag" data-tag="${esc(t)}">${esc(t)}</button>`).join('')}</div>`;
    toast(on ? 'Unflagged' : 'Flagged');
    refreshQuiet();
  }
  if(act === 'desk'){
    const already = !!deskState(s);
    s.desked = now(); s.updatedAt = now(); persist();
    btn.classList.add('on');
    btn.classList.remove('pinned'); void btn.offsetWidth; btn.classList.add('pinned');
    buzz(10);
    toast(already ? 'Returned to the top of the desk' : 'Placed on the desk');
    setTimeout(refreshQuiet, 420);
  }
  if(act === 'note'){ openAddNote(s); }
  if(act === 'source'){
    const box = cardEl.querySelector('.source');
    if(box.classList.contains('hide')) box.innerHTML = sourceHtml(s);
    box.classList.toggle('hide');
    btn.classList.toggle('on');
  }
  if(act === 'bury'){
    s.state = 'graveyard'; s.updatedAt = now(); persist();
    cardEl.style.transition = 'opacity .3s, transform .3s';
    cardEl.style.opacity = 0; cardEl.style.transform = 'scale(.97)';
    setTimeout(()=>{ cardEl.remove(); refreshQuiet(); }, 300);
    toast('Sent to the graveyard');
  }
  if(act === 'edit'){ editSpell(s); }
});

/* =========================================================================
   Notes — a thread that accumulates on a spell: what happened when you
   used it, or an answer to what it asked. Adding one is a top-level quick
   action (the card's note icon); reading the thread is an extra step,
   behind the spell's detail sheet, so it doesn't clutter the card.

   Shape is deliberately generic — { id, type, text, createdAt } — so a
   future voice note can land in the same array as {type:'voice', file},
   its audio in its own file with just the filename stored here, same as
   everything else that isn't small stays out of the JSON.
   ========================================================================= */
function addNoteToSpell(s, note){
  if(!Array.isArray(s.notes)) s.notes = [];
  s.notes.push(Object.assign({ id:nid(), createdAt:now() }, note));
  s.updatedAt = now();
  persist();
  redrawCard(s);
  refreshQuiet();
}

/* The quick action: a short sheet, nothing but a textarea, so capture stays
   as fast as marking a spell useful. */
function openAddNote(s){
  sheet('Add a note', `
    <p class="help" style="margin-top:0">What happened when you used this — or an answer to what it asked.</p>
    <div class="field" style="margin-top:9px"><textarea id="nText" placeholder="Write a note…"></textarea></div>
    <button class="btn" id="nSave">Save note</button>
    <button class="btn ghost" id="nCancel">Cancel</button>
  `);
  $('#nText').focus();
  $('#nSave').onclick = () => {
    const text = $('#nText').value.trim();
    if(!text){ toast('A note needs words'); return; }
    addNoteToSpell(s, {type:'text', text});
    closeSheet();
    toast('Note added');
  };
  $('#nCancel').onclick = closeSheet;
}

function noteTime(iso){
  const d = new Date(iso);
  if(isNaN(d)) return '';
  const sameYear = d.getFullYear() === new Date().getFullYear();
  const date = d.toLocaleDateString(undefined, {month:'short', day:'numeric', year: sameYear?undefined:'numeric'});
  const time = d.toLocaleTimeString(undefined, {hour:'numeric', minute:'2-digit'});
  return `${date} · ${time}`;
}

/* type is read but not yet acted on beyond 'text' — the branch is here so
   a 'voice' note (queued: mic permission, its own bridge method, audio in
   its own file) has a slot to render into without restructuring this. */
function noteHtml(n){
  const body = n.type === 'voice'
    ? `<div class="note-text" style="color:var(--dim)">🎙 voice note${n.duration?` · ${n.duration}s`:''}</div>`
    : `<p class="note-text">${fmt(n.text || '')}</p>`;
  return `<div class="note">
    <div class="note-meta">
      <span>${esc(noteTime(n.createdAt))}</span>
      <button class="note-del" data-nid="${esc(n.id)}" aria-label="Delete note">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    ${body}
  </div>`;
}

/* The extra step: the full thread, oldest first like a conversation,
   with the composer for the next entry waiting at the bottom. */
function openNotes(s, keep){
  const notes = (s.notes || []).slice().sort((a,b) => (a.createdAt||'').localeCompare(b.createdAt||''));
  sheet('Notes', `
    <div class="notes" id="notesThread">
      ${notes.length ? notes.map(noteHtml).join('')
        : `<p class="note-empty">No notes yet — add the first one below.</p>`}
    </div>
    <div class="field" style="margin-top:${notes.length?'18px':'6px'}">
      <label>Add a note</label>
      <textarea id="nText2" placeholder="Write a note…"></textarea>
    </div>
    <button class="btn" id="nSave2">Save note</button>
  `, null, keep);
  const body = document.querySelector('.sheet .body');
  if(body) body.scrollTop = body.scrollHeight;
  $('#nSave2').onclick = () => {
    const text = $('#nText2').value.trim();
    if(!text){ toast('A note needs words'); return; }
    addNoteToSpell(s, {type:'text', text});
    openNotes(s, true);
  };
  document.querySelectorAll('#notesThread .note-del').forEach(b => b.onclick = () => {
    s.notes = (s.notes || []).filter(n => n.id !== b.dataset.nid);
    s.updatedAt = now(); persist(); redrawCard(s); refreshQuiet();
    openNotes(s, true);
  });
}

/* =========================================================================
   Filters
   ========================================================================= */
function tagFilterBits(){
  const bits = [];
  if(S.include.length) bits.push(S.include.join(', '));
  if(S.require.length) bits.push('needs ' + S.require.join(', '));
  if(S.exclude.length) bits.push('never ' + S.exclude.join(', '));
  return bits;
}
function filterSummary(){
  const bits = tagFilterBits();
  return bits.length ? bits.join(' · ') : 'All ' + pool().length + ' spells';
}
function libFilterLabel(){
  const bits = tagFilterBits();
  return bits.length ? bits.join(' · ') : 'Filter';
}
function renderFilterBar(){
  const n = pool().length;
  $('#filterbar').innerHTML = `
    <button class="chip${(S.include.length||S.require.length||S.exclude.length)?' on':''}" id="filterChip">
      <svg viewBox="0 0 24 24"><path d="M3 5h18M6 12h12M10 19h4"/></svg>
      ${esc(filterSummary())}
    </button>
    <div class="seg" style="margin-left:auto">
      ${[1,2,3].map(n=>`<button data-n="${n}" class="${S.drawCount===n?'on':''}">${n}</button>`).join('')}
    </div>`;
  $('#filterChip').onclick = openFilters;
  $('#filterbar').querySelectorAll('[data-n]').forEach(b => b.onclick = () => {
    S.drawCount = +b.dataset.n; persist(); renderFilterBar();
  });
}

function openFilters(){
  const tags = allTags();
  const situ = tags.filter(([t]) => isSituationLike(t));
  const special = tags.filter(([t]) => !isSituationLike(t));
  sheet('Filters', `
    <p class="help" style="margin:2px 0 4px">Situations: tap any that apply. Type &amp; marks: set
    Require or Never. Narrows the draw and the library both, and stays put between sessions.</p>
    <span class="eyebrow" style="display:block;margin-top:8px">Situations</span>
    <div class="taggrid" id="fSitu">
      ${situ.map(([t,n])=>{
        const on = S.include.includes(t);
        return `<button class="tagbtn" data-t="${esc(t)}" style="${on?'border-color:var(--brass);':''}">
          <span class="nm" style="${on?'color:var(--brass)':''}">${esc(t)}</span>
          <span class="ct">${n}</span></button>`;
      }).join('')}
    </div>
    <span class="eyebrow" style="display:block;margin-top:6px">Type &amp; marks</span>
    <div class="factlist" id="fSpecial">
      ${special.map(([t,n])=>{
        const on = S.require.includes(t), off = S.exclude.includes(t);
        return `<div class="factitem" data-t="${esc(t)}" data-n="${n}">
          <span class="nm" style="${on?'color:var(--brass)':off?'text-decoration:line-through;opacity:.6':''}">${esc(t)}<span class="ct">${n}</span></span>
          <span class="seg">
            <button data-mode="require" class="${on?'on':''}">Require</button>
            <button data-mode="never" class="${off?'on':''}">Never</button>
          </span>
        </div>`;
      }).join('')}
    </div>
    <div style="font-size:13px;color:var(--dim);text-align:center;padding:4px 0" id="fCount"></div>
    <button class="btn ghost" id="fClear">Clear all filters</button>
    <button class="btn" id="fDone">Done</button>
  `, () => {});

  /* Once any filter is active, each Type & marks tag shows what the pool
     would shrink to if it were also Required — the original count crossed
     out, the hypothetical count beside it. */
  const updSpecialCounts = () => {
    const filtersActive = S.include.length || S.require.length || S.exclude.length;
    $('#fSpecial').querySelectorAll('.factitem').forEach(row => {
      const t = row.dataset.t, n = row.dataset.n;
      const ct = row.querySelector('.ct');
      if(filtersActive){
        ct.innerHTML = `<s style="opacity:.55">${n}</s> ${requireCountWith(t)}`;
      } else {
        ct.textContent = n;
      }
    });
  };
  const upd = () => {
    $('#fCount').textContent = pool().length + ' spells in the pool';
    updSpecialCounts();
  };
  upd();
  $('#fSitu').querySelectorAll('[data-t]').forEach(b => b.onclick = () => {
    const t = b.dataset.t;
    const on = S.include.includes(t);
    S.include = on ? S.include.filter(x=>x!==t) : [...S.include, t];
    persist();
    b.style.borderColor = !on ? 'var(--brass)' : '';
    b.querySelector('.nm').style.color = !on ? 'var(--brass)' : '';
    upd();
  });
  $('#fSpecial').querySelectorAll('.factitem').forEach(row => {
    const t = row.dataset.t;
    row.querySelectorAll('[data-mode]').forEach(btn => btn.onclick = () => {
      const mode = btn.dataset.mode;
      const wasOn = btn.classList.contains('on');
      S.require = S.require.filter(x => x !== t);
      S.exclude = S.exclude.filter(x => x !== t);
      if(!wasOn){ if(mode === 'require') S.require.push(t); else S.exclude.push(t); }
      persist();
      const nowOn = S.require.includes(t), nowOff = S.exclude.includes(t);
      row.querySelector('[data-mode="require"]').classList.toggle('on', nowOn);
      row.querySelector('[data-mode="never"]').classList.toggle('on', nowOff);
      const nm = row.querySelector('.nm');
      nm.style.color = nowOn ? 'var(--brass)' : '';
      nm.style.textDecoration = nowOff ? 'line-through' : 'none';
      nm.style.opacity = nowOff ? '.6' : '';
      upd();
    });
  });
  $('#fClear').onclick = () => { S.include = []; S.require = []; S.exclude = []; persist(); closeSheet(); renderAll(); };
  $('#fDone').onclick = () => { closeSheet(); renderAll(); };
}

/* =========================================================================
   Library
   ========================================================================= */
let libTag = null, libGrave = false;
const SORTS = {recent:'Recent', useful:'Most useful', drawn:'Most drawn'};

function renderLibrary(){
  if(!SORTS[S.sort]) S.sort = 'recent';
  const q = ($('#search').value || '').trim().toLowerCase();
  let list = libGrave ? buried() : active();
  if(libTag) list = list.filter(s => tagsOf(s).includes(libTag));
  list = list.filter(matchesFilters);
  if(q) list = list.filter(s => s.text.toLowerCase().includes(q) || tagsOf(s).some(t=>t.includes(q)));

  list = list.slice().sort((a,b)=>{
    if(S.sort==='useful') return b.useful-a.useful || b.drawn-a.drawn;
    if(S.sort==='drawn') return b.drawn-a.drawn;
    return (b.source?.capturedAt||'').localeCompare(a.source?.capturedAt||'');
  });

  $('#libTitle').textContent = libGrave ? 'Graveyard' : libTag ? libTag : 'The book';
  $('#libCount').textContent = list.length + (list.length===1?' spell':' spells');

  const filtered = S.include.length || S.require.length || S.exclude.length;
  $('#libFilter').innerHTML = `
    ${libTag ? `<button class="chip on" id="clearTag">${esc(libTag)} <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>` : ''}
    ${libGrave ? `<button class="chip on" id="clearGrave">graveyard <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>` : ''}
    <button class="chip${filtered?' on':''}" id="libFilterChip">
      <svg viewBox="0 0 24 24"><path d="M3 5h18M6 12h12M10 19h4"/></svg>
      ${esc(libFilterLabel())}
    </button>
    <button class="chip" id="sortChip">${SORTS[S.sort]}</button>`;
  const ct = $('#clearTag'); if(ct) ct.onclick = () => { libTag=null; renderLibrary(); };
  const cg = $('#clearGrave'); if(cg) cg.onclick = () => { libGrave=false; renderLibrary(); };
  $('#libFilterChip').onclick = openFilters;
  $('#sortChip').onclick = () => {
    const k = Object.keys(SORTS); S.sort = k[(k.indexOf(S.sort)+1)%k.length]; persist(); renderLibrary();
  };

  if(!list.length){
    const title = q ? 'Nothing found' : filtered ? 'Nothing matches your filters' : libGrave ? 'The graveyard is empty' : 'No spells here';
    const sub = q ? 'Try a different word.' : filtered ? 'Adjust the filters to see more.' : libGrave ? 'Nothing has been buried yet.' : 'Add one from the Vault.';
    $('#libList').innerHTML = `<div class="empty"><b>${title}</b>${sub}</div>`;
    return;
  }
  $('#libList').innerHTML = list.map(s => {
    let t = esc(s.text.replace(/[*=]/g,''));
    if(q){ const i = t.toLowerCase().indexOf(q);
      if(i>=0) t = t.slice(0,i)+'<span class="hit">'+t.slice(i,i+q.length)+'</span>'+t.slice(i+q.length); }
    return `<button class="row${libGrave?' gone':''}" data-open="${s.id}">
      <div class="t">${t}</div>
      <div class="m">
        ${s.useful?`<span class="mt">♥ ${s.useful}</span>`:''}
        ${s.drawn?`<span>drawn ${s.drawn}×</span>`:''}
        <span>${esc(tagsOf(s).slice(0,4).join(' · '))}</span>
      </div></button>`;
  }).join('');
  $('#libList').querySelectorAll('[data-open]').forEach(b =>
    b.onclick = () => openSpell(doc.spells.find(s=>s.id===b.dataset.open)));
}

function openSpell(s){
  if(!s) return;
  const grave = s.state === 'graveyard';
  const noteCount = (s.notes || []).length;
  sheet('Spell', `<div id="sheetCard">${card(s,{delay:undefined})}</div>
    <button class="btn ghost" id="spNotes">${noteCount ? `Notes (${noteCount})` : 'Notes'}</button>
    <button class="btn ghost" id="spEdit">Edit</button>
    <button class="btn ${grave?'':'danger'}" id="spGrave">${grave?'Restore to the book':'Move to graveyard'}</button>`);
  $('#sheetCard .card').classList.remove('rise');
  $('#spNotes').onclick = () => { closeSheet(); openNotes(s); };
  $('#spEdit').onclick = () => { closeSheet(); editSpell(s); };
  $('#spGrave').onclick = () => {
    s.state = grave ? 'active' : 'graveyard'; s.updatedAt = now(); persist();
    closeSheet(); renderAll(); toast(grave ? 'Back in the book' : 'Sent to the graveyard');
  };
}

function openTag(t){
  libTag = t; libGrave = false; $('#search').value = '';
  closeSheet(); go('library');
}

/* =========================================================================
   Tags screen
   ========================================================================= */
let tagEditMode = false;

function renderTags(){
  const all = allTags();
  const tags = tagEditMode ? all.filter(([t]) => !STRUCTURAL.includes(t)) : all;
  $('#tagCount').textContent = tagEditMode
    ? 'Tap a tag to rename or remove it. Computed tags aren\'t editable, and a couple of others are locked.'
    : all.length + ' tags';
  $('#tagEdit').textContent = tagEditMode ? 'Done' : 'Edit';
  $('#tagEdit').classList.toggle('on', tagEditMode);
  $('#tagGrid').innerHTML = tags.map(([t,n]) =>
    `<button class="tagbtn${isSituationLike(t)?' struct':''}" data-t="${esc(t)}">
      <span class="nm">${esc(t)}</span><span class="ct">${n}</span></button>`).join('')
    || `<div class="empty"><b>No tags yet</b>Tags appear as you add them to spells.</div>`;
  $('#tagGrid').querySelectorAll('[data-t]').forEach(b =>
    b.onclick = () => tagEditMode ? manageTag(b.dataset.t) : openTag(b.dataset.t));
}

function manageTag(tag){
  const held = doc.spells.filter(s => s.tags.includes(tag));
  const taken = new Set(doc.spells.flatMap(s => s.tags));
  const locked = PROTECTED.includes(tag);
  sheet('Tag', `
    <p class="spell lg" style="margin:4px 0 6px">${esc(tag)}</p>
    <p class="help" style="margin:0">On ${held.length} ${held.length===1?'spell':'spells'}.</p>
    <div class="field"><label>Kind</label>
      <div class="seg" id="tgKind" style="width:100%;display:flex">
        <button data-kind="situation" class="${isSituationLike(tag)?'on':''}" style="flex:1">Situation</button>
        <button data-kind="special" class="${!isSituationLike(tag)?'on':''}" style="flex:1">Type &amp; mark</button>
      </div>
      <p class="help" style="margin:6px 0 0">Situations OR together in the filter sheet. Type &amp; marks each
      get their own Require/Never, AND'd.</p>
    </div>
    ${locked ? `<p class="help" style="margin:10px 0 0">Built into the app — can't be renamed or removed here.
      Untag a spell from its card or the editor instead.</p>` : `
    <div class="field"><label>Rename</label>
      <input id="tgName" value="${esc(tag)}" autocomplete="off" spellcheck="false"></div>
    <button class="btn" id="tgSave">Rename</button>
    <button class="btn danger" id="tgDel">Remove from all spells</button>`}
    <button class="btn ghost" id="tgCancel">${locked?'Close':'Cancel'}</button>
  `);

  $('#tgKind').querySelectorAll('[data-kind]').forEach(b => b.onclick = () => {
    const kind = b.dataset.kind;
    if((kind === 'situation') === isSituationLike(tag)) return;   // already that kind
    const isDefaultKind = (kind === 'situation') === SITUATIONS.includes(tag);
    if(isDefaultKind) delete S.tagKindOverrides[tag];
    else S.tagKindOverrides[tag] = kind;
    /* A tag that changes kind no longer belongs in the filter bucket it was
       sitting in — carry it to the matching one rather than leaving it
       stuck (Require/Never don't apply to situations) or silently dropped. */
    if(kind === 'situation'){
      if(S.require.includes(tag)){ S.require = S.require.filter(x=>x!==tag); if(!S.include.includes(tag)) S.include.push(tag); }
      S.exclude = S.exclude.filter(x=>x!==tag);
    } else {
      if(S.include.includes(tag)){ S.include = S.include.filter(x=>x!==tag); if(!S.require.includes(tag)) S.require.push(tag); }
    }
    persist();
    $('#tgKind').querySelectorAll('[data-kind]').forEach(bb => bb.classList.toggle('on', bb.dataset.kind===kind));
    renderAll();
    toast(kind === 'situation' ? '“' + tag + '” is now a situation' : '“' + tag + '” is now a type & mark');
  });

  if(!locked){
    $('#tgSave').onclick = () => {
      const next = $('#tgName').value.trim().toLowerCase().replace(/\s+/g,'-');
      if(!next){ toast('A tag needs a name'); return; }
      if(next === tag){ closeSheet(); return; }
      if(STRUCTURAL.includes(next) || PROTECTED.includes(next)){ toast('That name is reserved'); return; }
      // Merging two tags is deliberately not supported yet.
      if(taken.has(next)){ toast('“' + next + '” already exists'); return; }
      for(const s of held){
        s.tags = s.tags.map(t => t === tag ? next : t).sort();
        s.updatedAt = now();
      }
      if(libTag === tag) libTag = next;
      S.include = S.include.map(t => t === tag ? next : t);
      S.require = S.require.map(t => t === tag ? next : t);
      S.exclude = S.exclude.map(t => t === tag ? next : t);
      if(Object.prototype.hasOwnProperty.call(S.tagKindOverrides, tag)){
        S.tagKindOverrides[next] = S.tagKindOverrides[tag];
        delete S.tagKindOverrides[tag];
      }
      persist(); closeSheet(); renderAll(); renderTags();
      toast('Renamed to ' + next);
    };

    let armed = false;
    $('#tgDel').onclick = () => {
      if(!armed){
        armed = true;
        $('#tgDel').textContent = `Tap again to remove from ${held.length}`;
        setTimeout(()=>{ armed = false;
          const b = $('#tgDel'); if(b) b.textContent = 'Remove from all spells'; }, 3500);
        return;
      }
      for(const s of held){ s.tags = s.tags.filter(t => t !== tag); s.updatedAt = now(); }
      if(libTag === tag) libTag = null;
      S.include = S.include.filter(t => t !== tag);
      S.require = S.require.filter(t => t !== tag);
      S.exclude = S.exclude.filter(t => t !== tag);
      delete S.tagKindOverrides[tag];
      persist(); closeSheet(); renderAll(); renderTags();
      toast('Removed ' + tag);
    };
  }
  $('#tgCancel').onclick = closeSheet;
}
