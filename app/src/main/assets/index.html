<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#101216">
<title>Spellbook</title>
<style>
:root{
  --void:#101216; --slate:#191c22; --raise:#22262e; --line:#2c313a;
  --ink:#e6e1d7; --muted:#8a8f9a; --dim:#5f646e;
  --brass:#c4a05a; --brass-dim:#7a6336; --brass-glow:rgba(196,160,90,.16);
  --serif:Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --pad:20px;
  --tabh:58px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{
  background:var(--void); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.5;
  padding-top:env(safe-area-inset-top);
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit;background:var(--slate);border:1px solid var(--line);
  border-radius:10px;padding:11px 13px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--brass-dim)}
textarea{resize:vertical;min-height:120px;font-family:var(--serif);font-size:17px;line-height:1.5}
::placeholder{color:var(--dim)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* ---------- shell ---------- */
#app{height:100%;display:flex;flex-direction:column;overflow:hidden}
.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:0 var(--pad) calc(var(--tabh) + env(safe-area-inset-bottom) + 24px)}
.screen.center{display:flex;flex-direction:column;padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom))}
.hide{display:none !important}

.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
  font-weight:600}
.hdr{padding:22px 0 14px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.hdr h1{font-family:var(--serif);font-size:25px;font-weight:400;margin:0;letter-spacing:.01em}
.count{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}

/* ---------- tabs ---------- */
nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--tabh) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(16,18,22,.94);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:flex;z-index:40}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--dim);font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;
  transition:color .18s}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.4;
  stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--brass)}

/* ---------- draw ---------- */
#draw{position:relative;display:flex;flex-direction:column}
.altar{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;width:100%;
  gap:26px;padding:12px 0;order:2;transition:gap .35s}
.sigil-wrap{position:relative;width:190px;height:190px;display:grid;place-items:center;
  transition:width .4s cubic-bezier(.3,.7,.3,1),height .4s cubic-bezier(.3,.7,.3,1),
             transform .5s cubic-bezier(.4,0,.2,1),opacity .45s}

/* after a cast: the spell takes the room, the sigil becomes a footer mark */
#draw.revealed .altar{flex:0 0 auto;flex-direction:row;gap:13px;padding:11px 0 4px;
  border-top:1px solid var(--line);order:3}
#draw.revealed .sigil-wrap{width:38px;height:38px}
#draw.revealed .cast-label{font-size:10px;letter-spacing:.18em;text-align:left;min-height:0}
#draw.revealed .results{display:flex;order:2;flex:1;min-height:0;overflow-y:auto;
  -webkit-overflow-scrolling:touch;padding:4px 0 14px}
#draw.revealed .results>.inner{margin:auto 0;display:flex;flex-direction:column;gap:14px;width:100%}
#draw.revealed .pulse{animation:none;opacity:.8}
#draw.revealed .halo,#draw.revealed .rot-slow,#draw.revealed .rot-back{opacity:0;transition:opacity .3s}
.sigil{width:100%;height:100%;overflow:visible}
.sigil .st{fill:none;stroke:var(--brass);stroke-linecap:round;vector-effect:non-scaling-stroke}
.sigil .halo{stroke:var(--brass);opacity:.055}
#sigilBtn{position:absolute;inset:-14px;border-radius:50%}
.rot-slow{transform-origin:50% 50%;animation:spin 64s linear infinite}
.rot-back{transform-origin:50% 50%;animation:spin 92s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.sigil-wrap.casting .rot-slow{animation-duration:1.6s}
.sigil-wrap.casting .rot-back{animation-duration:2.2s}
.sigil-wrap.casting{transform:scale(.9)}
.sigil-wrap.spent{transform:scale(.62);opacity:0;pointer-events:none}
.pulse{animation:pulse 4.5s ease-in-out infinite}
.sigil-wrap.denied{animation:nudge .4s}
@keyframes nudge{20%{transform:translateX(-3px)}45%{transform:translateX(3px)}70%{transform:translateX(-2px)}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.cast-label{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);
  font-weight:600;transition:color .3s;text-align:center;min-height:16px}
.cast-label.ready{color:var(--brass-dim)}

/* recharge ring */
.recharge{--circ:490.1;--cool:6000ms;stroke:var(--brass);stroke-width:1.6;fill:none;opacity:.9;
  stroke-dasharray:var(--circ);stroke-dashoffset:var(--circ);transform:rotate(-90deg);transform-origin:50% 50%}
.recharge.run{animation:draw-ring var(--cool) linear forwards}
@keyframes draw-ring{to{stroke-dashoffset:0}}

/* ---------- spell card ---------- */
.results{width:100%;display:none;flex-direction:column;gap:14px;padding:8px 0 4px}
.card{background:var(--slate);border:1px solid var(--line);border-radius:15px;
  padding:20px 19px 13px;position:relative;overflow:hidden}
.card.rise{animation:rise .55s cubic-bezier(.2,.7,.3,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;
  background:linear-gradient(180deg,var(--brass),transparent 85%);opacity:.55}
.spell{font-family:var(--serif);font-size:19.5px;line-height:1.48;white-space:pre-wrap;
  word-break:break-word;margin:0 0 14px;letter-spacing:.004em}
.spell.lg{font-size:22px}
.spell.sm{font-size:17px;line-height:1.55}
.spell b{font-weight:700;color:#f2eee6}
.spell .mk{color:var(--brass);font-style:normal}

.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tag{font-size:11px;letter-spacing:.07em;padding:3.5px 9px;border-radius:999px;
  border:1px solid var(--line);color:var(--muted);background:#00000022}
.tag.brass{color:var(--brass);border-color:var(--brass-dim)}
button.tag:active{border-color:var(--brass-dim)}

.actions{display:flex;align-items:center;gap:4px;border-top:1px solid var(--line);
  padding-top:9px;margin-top:2px}
.act{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:9px;
  color:var(--dim);font-size:12.5px;letter-spacing:.02em;transition:color .15s,background .15s}
.act svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round}
.act:active{background:#ffffff0a}
.act.on{color:var(--brass)}
.act.on svg{fill:var(--brass-glow)}
.act .n{font-variant-numeric:tabular-nums}
.act.right{margin-left:auto}

.source{border-top:1px solid var(--line);margin-top:9px;padding-top:11px;
  font-size:12.5px;color:var(--muted);line-height:1.65}
.source div{display:flex;gap:9px}
.source dt{color:var(--dim);min-width:64px;flex-shrink:0}
.source a{color:var(--brass);word-break:break-all}

/* ---------- filter bar ---------- */
.filterbar{position:sticky;top:0;z-index:5;background:linear-gradient(var(--void) 72%,transparent);
  padding:12px 0 10px;display:flex;gap:8px;align-items:center}
.chip{font-size:12px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);
  color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:7px}
.chip.on{border-color:var(--brass-dim);color:var(--brass)}
.chip svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round}

/* ---------- lists ---------- */
.row{width:100%;text-align:left;padding:15px 2px;border-bottom:1px solid var(--line);display:block}
.row:last-child{border-bottom:none}
.row .t{font-family:var(--serif);font-size:16.5px;line-height:1.42;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  white-space:pre-wrap;margin-bottom:7px}
.row .m{display:flex;gap:9px;align-items:center;font-size:11px;color:var(--dim);flex-wrap:wrap}
.row .m .mt{color:var(--muted)}
.row.gone .t{color:var(--dim)}
.hit{color:var(--brass);background:var(--brass-glow);border-radius:2px}

.taggrid{display:flex;flex-wrap:wrap;gap:9px;padding:6px 0 20px}
.tagbtn{border:1px solid var(--line);border-radius:11px;padding:11px 14px;background:var(--slate);
  display:flex;align-items:baseline;gap:9px;min-width:0}
.tagbtn .nm{font-size:14px}
.tagbtn .ct{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.tagbtn.struct .nm{color:var(--brass)}

.empty{text-align:center;color:var(--dim);padding:52px 20px;font-size:14px;line-height:1.7}
.empty b{display:block;font-family:var(--serif);font-size:19px;color:var(--muted);
  font-weight:400;margin-bottom:8px}

/* ---------- vault ---------- */
.group{margin:22px 0 0}
.group>.eyebrow{margin-bottom:10px;display:block}
.item{width:100%;display:flex;align-items:center;gap:13px;padding:15px 15px;background:var(--slate);
  border:1px solid var(--line);border-radius:12px;margin-bottom:9px;text-align:left}
.item svg{width:19px;height:19px;stroke:var(--brass);fill:none;stroke-width:1.4;
  stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.item .lab{flex:1;min-width:0}
.item .lab .s{display:block;font-size:12px;color:var(--dim);margin-top:2px;line-height:1.45}
.item .val{color:var(--muted);font-size:13px;flex-shrink:0}
.seg{display:flex;gap:6px;background:var(--void);border:1px solid var(--line);
  border-radius:9px;padding:3px}
.seg button{padding:5px 13px;border-radius:6px;font-size:13px;color:var(--muted);
  font-variant-numeric:tabular-nums}
.seg button.on{background:var(--raise);color:var(--brass)}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:#080a0ccc;backdrop-filter:blur(3px);z-index:50;
  animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--slate);
  border-top:1px solid var(--line);border-radius:19px 19px 0 0;
  max-height:90vh;display:flex;flex-direction:column;
  animation:up .3s cubic-bezier(.2,.8,.3,1);padding-bottom:env(safe-area-inset-bottom)}
@keyframes up{from{transform:translateY(100%)}}
.sheet .grab{width:34px;height:4px;border-radius:2px;background:var(--line);margin:9px auto 2px;flex-shrink:0}
.sheet .body{overflow-y:auto;padding:12px 19px 22px}
.sheet .top{display:flex;align-items:center;justify-content:space-between;padding:8px 19px 2px;flex-shrink:0}
.sheet .top .eyebrow{color:var(--brass-dim)}
.btn{display:block;width:100%;text-align:center;padding:13px;border-radius:11px;
  background:var(--brass);color:#15120b;font-weight:650;font-size:15px;letter-spacing:.01em;margin-top:14px}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--muted);font-weight:500}
.btn.danger{background:none;border:1px solid #5c3630;color:#c47a68;font-weight:500}
.field{margin-top:15px}
.field label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);font-weight:600;margin-bottom:7px}
.help{font-size:12.5px;color:var(--dim);line-height:1.6;margin-top:9px}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 16px);}
#toast.high{bottom:auto;top:calc(env(safe-area-inset-top) + 16px);animation:toastHigh .25s}
@keyframes toastHigh{from{opacity:0;transform:translate(-50%,-10px)}}
#toast{
  background:var(--raise);border:1px solid var(--line);color:var(--ink);
  padding:10px 17px;border-radius:999px;font-size:13.5px;z-index:80;
  animation:toast .25s;box-shadow:0 8px 26px #0009;max-width:88vw;text-align:center}
@keyframes toast{from{opacity:0;transform:translate(-50%,10px)}}

/* ---------- triage ---------- */
.triage-bar{display:flex;gap:9px;margin-top:16px}
.triage-bar button{flex:1;padding:13px 8px;border-radius:11px;border:1px solid var(--line);
  font-size:13.5px;color:var(--muted);background:var(--slate)}
.triage-bar button.keep{border-color:var(--brass-dim);color:var(--brass)}
.progress{height:2px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:14px}
.progress i{display:block;height:100%;background:var(--brass);transition:width .3s}

.banner{background:#20242c;border:1px solid var(--line);border-left:2px solid var(--brass-dim);
  border-radius:0 9px 9px 0;padding:11px 14px;font-size:12.5px;color:var(--muted);
  line-height:1.55;margin:14px 0 0}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s !important;transition-duration:.001s !important}
  .recharge.run{animation-duration:var(--cool) !important}
}
</style>
</head>

<script>
/* =========================================================================
   Storage — the Android bridge is the real one. In a plain browser we keep
   state in memory so the app is fully explorable, just not persistent.
   ========================================================================= */
const Bridge = window.Android && typeof window.Android.save === 'function' ? window.Android : null;
let memory = null;

const Store = {
  load(){
    try{
      const raw = Bridge ? Bridge.load() : memory;
      return raw ? (typeof raw === 'string' ? JSON.parse(raw) : raw) : null;
    }catch(e){ console.warn('load failed', e); return null; }
  },
  save(doc){
    const raw = JSON.stringify(doc);
    if(Bridge) { try { Bridge.save(raw); } catch(e){ console.warn('save failed', e); } }
    else memory = raw;
  }
};

ve or loud. I can calmly ask for things. She is not my mother","tags":["expression","fear","relationship"],"source":{"origin":"obsidian","note":"2025-09-07 Sun","file":"1 - daily notes/2025/2025 fools valley/2025-09-07 Sun.md","line":106,"url":null,"capturedAt":"2025-09-07"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_bb04e912","text":"is there a place in the world I would like to be more right now?","tags":["desire","question"],"source":{"origin":"obsidian","note":"2025-01-20 Mon","file":"1 - daily notes/2025/2025-01/2025-01-20 Mon.md","line":1,"url":null,"capturedAt":"2025-01-20"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_8f21f57b","text":"Look through the representations not at them","tags":["attention"],"source":{"origin":"obsidian","note":"2025-01-20 Mon","file":"1 - daily notes/2025/2025-01/2025-01-20 Mon.md","line":3,"url":null,"capturedAt":"2025-01-20"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_05e1d2a9","text":"feeling is healing","tags":["body","whisper"],"source":{"origin":"obsidian","note":"2025-01-20 Mon","file":"1 - daily notes/2025/2025-01/2025-01-20 Mon.md","line":5,"url":null,"capturedAt":"2025-01-20"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_8fc9bc44","text":"==Allow yourself to be seen==\n==Reach for the things you want==\n==Allow yourself to be seen for wanting them==","tags":["desire","expression"],"source":{"origin":"obsidian","note":"2025-02-10 Mon","file":"1 - daily notes/2025/2025-02/2025-02-10 Mon.md","line":90,"url":null,"capturedAt":"2025-02-10"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_2fbada89","text":"all tension is generative","tags":["body","whisper"],"source":{"origin":"obsidian","note":"2025-02-16 Sun","file":"1 - daily notes/2025/2025-02/2025-02-16 Sun.md","line":12,"url":null,"capturedAt":"2025-02-16"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_36a993f7","text":"That what I am seeking is seeking me.","tags":["desire","sacred"],"source":{"origin":"obsidian","note":"2025-02-27 Thu","file":"1 - daily notes/2025/2025-02/2025-02-27 Thu.md","line":79,"url":null,"capturedAt":"2025-02-27"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_100bd486","text":"zuhören um zu verstehen nicht um zu antworten","tags":["attention","connection","de"],"source":{"origin":"obsidian","note":"2025-02-27 Thu","file":"1 - daily notes/2025/2025-02/2025-02-27 Thu.md","line":165,"url":null,"capturedAt":"2025-02-27"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_f7bfa998","text":"I can turn dials up and down if I can find them. Like playfulness or sensuality","tags":["agency","body"],"source":{"origin":"obsidian","note":"2025-03-08 Sat","file":"1 - daily notes/2025/2025-03/2025-03-08 Sat.md","line":18,"url":null,"capturedAt":"2025-03-08"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_406bbf05","text":"can I go meta level without making it a big deal? Can I bring in 10 minute games that change the vibe? How can I find the stillness within myself and my attunement wit the field to let these arise?","tags":["connection","practice","question"],"source":{"origin":"obsidian","note":"2025-03-08 Sat","file":"1 - daily notes/2025/2025-03/2025-03-08 Sat.md","line":20,"url":null,"capturedAt":"2025-03-08"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_8274daa4","text":"where does my energy come from? What is its source?","tags":["body","question"],"source":{"origin":"obsidian","note":"2025-03-08 Sat","file":"1 - daily notes/2025/2025-03/2025-03-08 Sat.md","line":22,"url":null,"capturedAt":"2025-03-08"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_b8f08ca1","text":"That sense of the golden line of light guiding me out of the darkness has greatly diminished. Bring it back.\nFuck it. Have sex with it. Ejaculate in it. Play with it.\nThe perceptual distance has grown. The target appears smaller. The path less vital. Strengthen it anyway. See how it all brings you closer to the light. The eyes of friends. Love. Community.\nConstellate it (even if it's a weak version, the principles appear roughly the same).\nMy purpose must bring me closer to this!","tags":["desire","sacred","shadow"],"source":{"origin":"obsidian","note":"2025-03-09 Sun","file":"1 - daily notes/2025/2025-03/2025-03-09 Sun.md","line":1,"url":null,"capturedAt":"2025-03-09"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_63bb1de8","text":"how can you make going to the meta-level a yes and move?","tags":["connection","practices","question"],"source":{"origin":"obsidian","note":"2025-03-15 Sat","file":"1 - daily notes/2025/2025-03/2025-03-15 Sat.md","line":37,"url":null,"capturedAt":"2025-03-15"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_e53f79ed","text":"\"I often don't know things until someone asks me a question\"","tags":["connection","expression"],"source":{"origin":"obsidian","note":"2025-03-28 Fri","file":"1 - daily notes/2025/2025-03/2025-03-28 Fri.md","line":20,"url":null,"capturedAt":"2025-03-28"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_13aa17e1","text":"drop into your body. Listen to it. Let it comfort the mind. It knows how safe you actually are. It matters not what is there but what you feed energy","tags":["attention","body"],"source":{"origin":"obsidian","note":"2025-04-09 Wed","file":"1 - daily notes/2025/2025-04/2025-04-09 Wed.md","line":48,"url":null,"capturedAt":"2025-04-09"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_fbf6b06d","text":"admit overwhelm. Feel the overwhelm. What does the overwhelm give me? It's related to the capacity for pleasure","tags":["body","desire","question"],"source":{"origin":"obsidian","note":"2025-04-09 Wed","file":"1 - daily notes/2025/2025-04/2025-04-09 Wed.md","line":53,"url":null,"capturedAt":"2025-04-09"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_d206ba0c","text":"I can have a need even when others are in a process. Being punished for expressing needs","tags":["expression"],"source":{"origin":"obsidian","note":"2025-04-11 Fri","file":"1 - daily notes/2025/2025-04/2025-04-11 Fri.md","line":5,"url":null,"capturedAt":"2025-04-11"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_3cc6b314","text":"the punch is in the fear\nlove is scaffolding for fear\nif the fear disappears theres no motion","tags":["desire","fear"],"source":{"origin":"obsidian","note":"2025-04-14 Mon","file":"1 - daily notes/2025/2025-04/2025-04-14 Mon.md","line":47,"url":null,"capturedAt":"2025-04-14"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_375ef399","text":"\"what if I pretended I was doing it?\" Is a great spell to move at the pace of my intuition","tags":["agency","practice","question"],"source":{"origin":"obsidian","note":"2025-04-16 Wed","file":"1 - daily notes/2025/2025-04/2025-04-16 Wed.md","line":3,"url":null,"capturedAt":"2025-04-16"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_167ebcc4","text":"find the pleasure in fear","tags":["desire","fear","whisper"],"source":{"origin":"obsidian","note":"2025-04-16 Wed","file":"1 - daily notes/2025/2025-04/2025-04-16 Wed.md","line":8,"url":null,"capturedAt":"2025-04-16"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_84680402","text":"I'm a very movement based character. When I'm well I walk into a room dancing even if there's no audible music","tags":["body"],"source":{"origin":"obsidian","note":"2025-04-16 Wed","file":"1 - daily notes/2025/2025-04/2025-04-16 Wed.md","line":55,"url":null,"capturedAt":"2025-04-16"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_1201574a","text":"I connect to people through movement and touch a lot. Parties are good for that","tags":["body","connection"],"source":{"origin":"obsidian","note":"2025-04-16 Wed","file":"1 - daily notes/2025/2025-04/2025-04-16 Wed.md","line":57,"url":null,"capturedAt":"2025-04-16"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_f36b22d4","text":"become really good at sensing invitations","tags":["attention","connection"],"source":{"origin":"obsidian","note":"2025-04-16 Wed","file":"1 - daily notes/2025/2025-04/2025-04-16 Wed.md","line":68,"url":null,"capturedAt":"2025-04-16"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_faa45e3e","text":"when I ride my bike I wanna be suffused with care","tags":["care"],"source":{"origin":"obsidian","note":"2025-04-16 Wed","file":"1 - daily notes/2025/2025-04/2025-04-16 Wed.md","line":73,"url":null,"capturedAt":"2025-04-16"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_f56366e8","text":"I need a disorienting amount of care to navigate life sometimes.","tags":["care"],"source":{"origin":"obsidian","note":"2025-04-16 Wed","file":"1 - daily notes/2025/2025-04/2025-04-16 Wed.md","line":102,"url":null,"capturedAt":"2025-04-16"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_d57f25ef","text":"what's the win condition here?","tags":["agency","question"],"source":{"origin":"obsidian","note":"2025-04-17 Thu","file":"1 - daily notes/2025/2025-04/2025-04-17 Thu.md","line":6,"url":null,"capturedAt":"2025-04-17"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_2b0c4215","text":"I can love people without their consent. For example I can imagine hugging Doro","tags":["care","connection"],"source":{"origin":"obsidian","note":"2025-04-18 Fri","file":"1 - daily notes/2025/2025-04/2025-04-18 Fri.md","line":127,"url":null,"capturedAt":"2025-04-18"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_1aafe65e","text":"here's a crazy fucking hack. When you feel lonely and afraid and out of connection and you don't know what's real anymore. You can just reach out. You can just find some sliver or piece of curiosity or love and act on that. You don't have to announce how you feel. That never achieves anything anyway. You don't need to ask for help. You can just casually reach out. And the reason can still be that you feel those ways. Maybe it'll come up maybe it won't. Maybe it surfaces that you do need more help, maybe a simple message fixes it. You can even reach out to many people.\nYour friends love you and they will understand. They want and need you to feel good and connected. They will support you in taking the challenging steps of overcoming your patterns.","tags":["connection","fear"],"source":{"origin":"obsidian","note":"2025-04-19 Sat","file":"1 - daily notes/2025/2025-04/2025-04-19 Sat.md","line":17,"url":null,"capturedAt":"2025-04-19"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_7bf5cfd6","text":"I want to destroy\nI want to be comfortable with the destruction inherent in creation.\nI want to trust my creation and destruction","tags":["desire","shadow"],"source":{"origin":"obsidian","note":"2025-04-26 Sat","file":"1 - daily notes/2025/2025-04/2025-04-26 Sat.md","line":156,"url":null,"capturedAt":"2025-04-26"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_8983c10b","text":"das Leben schätzen lernen. Ich weiß so viel noch nicht zu schätzen","tags":["attention","care","de","trailheads"],"source":{"origin":"obsidian","note":"2025-04-30 Wed","file":"1 - daily notes/2025/2025-04/2025-04-30 Wed.md","line":12,"url":null,"capturedAt":"2025-04-30"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_0fb769d6","text":"readiness is a feeling that follows action not the other way around","tags":["agency"],"source":{"origin":"obsidian","note":"2025-05-06 Tue","file":"1 - daily notes/2025/2025-05/2025-05-06 Tue.md","line":1,"url":null,"capturedAt":"2025-05-06"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_f6559945","text":"what is your fighting energy aimed at right now and how?","tags":["agency","question","shadow"],"source":{"origin":"obsidian","note":"2025-05-06 Tue","file":"1 - daily notes/2025/2025-05/2025-05-06 Tue.md","line":3,"url":null,"capturedAt":"2025-05-06"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_381598dd","text":"how can you face and embrace who you are with all your gifts and limitations right now?","tags":["care","question"],"source":{"origin":"obsidian","note":"2025-05-06 Tue","file":"1 - daily notes/2025/2025-05/2025-05-06 Tue.md","line":5,"url":null,"capturedAt":"2025-05-06"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_b316d4ba","text":"you can take time to relax into sensations","tags":["body","pace"],"source":{"origin":"obsidian","note":"2025-05-06 Tue","file":"1 - daily notes/2025/2025-05/2025-05-06 Tue.md","line":7,"url":null,"capturedAt":"2025-05-06"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_d7982a14","text":"how can I embody that strength and responsibility?","tags":["agency","body","question"],"source":{"origin":"obsidian","note":"2025-05-06 Tue","file":"1 - daily notes/2025/2025-05/2025-05-06 Tue.md","line":9,"url":null,"capturedAt":"2025-05-06"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_4689a4d7","text hips > fantasy pipe dreams","tags":["connection","expression"],"source":{"origin":"obsidian","note":"2025-05-30 Fri","file":"1 - daily notes/2025/2025-05/2025-05-30 Fri.md","line":21,"url":null,"capturedAt":"2025-05-30"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_3b1af053","text":"you're not rewarded for your devotion, but by it. the things you're being asked to do are very directly connected with the things you're asking for","tags":["agency","sacred"],"source":{"origin":"obsidian","note":"2025-05-30 Fri","file":"1 - daily notes/2025/2025-05/2025-05-30 Fri.md","line":49,"url":null,"capturedAt":"2025-05-30"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_3c0f4621","text":"I'm finally finding this move of expansion and embodiment again.\nThoughts are lower dimensional than the body.\nSpace contains intelligence.\nGod is real.\nThis is fine and normal.\nYou don't need to understand it\nIt holds itself\nThat's the missing sense?\nThe one that is needed for a sense of safety in exploration?","tags":["body","question","sacred"],"source":{"origin":"obsidian","note":"2025-05-30 Fri","file":"1 - daily notes/2025/2025-05/2025-05-30 Fri.md","line":77,"url":null,"capturedAt":"2025-05-30"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_7025c2d7","text":"trust ist about trusting yourself with others","tags":["care","connection"],"source":{"origin":"obsidian","note":"2025-05-31 Sat","file":"1 - daily notes/2025/2025-05/2025-05-31 Sat.md","line":1,"url":null,"capturedAt":"2025-05-31"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_a3700b64","text":"learn to notice what excuses feel like somatically","tags":["attention","body"],"source":{"origin":"obsidian","note":"2025-05-31 Sat","file":"1 - daily notes/2025/2025-05/2025-05-31 Sat.md","line":19,"url":null,"capturedAt":"2025-05-31"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_12fac309","text":"thank you God for giving me a body that can hold all of experience","tags":["body","care","sacred"],"source":{"origin":"obsidian","note":"2025-06-02 Mon","file":"1 - daily notes/2025/2025-06/2025-06-02 Mon.md","line":76,"url":null,"capturedAt":"2025-06-02"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_3c3f1a4d","text":"what is this for me right now?\nit’s hilarious & obvious to me that the second I start telling the truth— and drop attachments that are or have been weighing me down— is the second that my visibility explodes","tags":["expression","question","sacred"],"source":{"origin":"obsidian","note":"2025-06-03 Tue","file":"1 - daily notes/2025/2025-06/2025-06-03 Tue.md","line":14,"url":null,"capturedAt":"2025-06-03"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_0205f278","text":"Is there ever gonna be a time where your freedom doesn't have consequences","tags":["agency","shadow"],"source":{"origin":"obsidian","note":"2025-06-03 Tue","file":"1 - daily notes/2025/2025-06/2025-06-03 Tue.md","line":22,"url":null,"capturedAt":"2025-06-03"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_76e24747","text":"find wholeness independent of a partner. Yes.\nMaybe get swept up but then be open about it and let it drain away","tags":["care","relationship"],"source":{"origin":"obsidian","note":"2025-06-06 Fri","file":"1 - daily take a few normal breaths to arrive. Set a gentle intention, something like “I’m preparing my body and mind to settle.”\n**Connected breathing** (3 to 5 minutes): Begin breathing in a connected rhythm with no pause between inhale and exhale, so the breath becomes one continuous circle. Breathe through the mouth, in and out, at a pace that feels active but sustainable. The inhale is active and full (into the belly, then chest), the exhale is a relaxed release. You’re not pushing air out, just letting it fall. After a couple of minutes, you’ll likely start to feel tingling, warmth, or a shift in body awareness. That’s the signal you’re dropping in.\n**Transition** (2 to 3 minutes): Slow the rhythm down gradually. Shift from mouth breathing to nose breathing. Start extending your exhales, aiming for roughly double the length of the inhale. If you’re inhaling for 4 counts, exhale for 7 or 8. Let each exhale carry a sense of softening in the jaw, shoulders, belly, and pelvic floor.","tags":["body","breathwork","fbr","practice"],"source":{"origin":"obsidian","note":"2026-04-01 Wed","file":"1 - daily notes/2026-04-01 Wed.md","line":5,"url":null,"capturedAt":"2026-04-01"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_0f18541a","text":"connect with my strengths. Strengthen that which is good and widen it. The capacities of my self","tags":["agency","care"],"source":{"origin":"obsidian","note":"2026-04-07 Tue","file":"1 - daily notes/2026-04-07 Tue.md","line":12,"url":null,"capturedAt":"2026-04-07"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_e0e9bdc4","text":"**find people that are doing something that I want to do**\n**and them showing me how to do that**\n**strengthening my inner strength and capacities**\n**while following my desires**","tags":["connection","desire"],"source":{"origin":"obsidian","note":"2026-04-15 Wed - computer","file":"1 - daily notes/2026-04-15 Wed - computer.md","line":25,"url":null,"capturedAt":"2026-04-15"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_f3c7c8ad","text":"**slow down**\n**slow down**\n**slow down**\nit's happening\nyou just gotta stay with it\nslow is smooth\nsmooth is fast","tags":["care","pace"],"source":{"origin":"obsidian","note":"2026-04-15 Wed - computer","file":"1 - daily notes/2026-04-15 Wed - computer.md","line":49,"url":null,"capturedAt":"2026-04-15"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_ca281209","text":"wie verfügbar fühlt sich Tanz an ist ein gutes Barometer","tags":["attention","body","de","signals"],"source":{"origin":"obsidian","note":"2026-04-16 Thu","file":"1 - daily notes/2026-04-16 Thu.md","line":9,"url":null,"capturedAt":"2026-04-16"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_d76315a7","text":"You are not responsible for resourcing yourself alone. But you are responsible for being honest about the resources you need and where you get them from.","tags":["care","expression","relationship"],"source":{"origin":"obsidian","note":"2026-05-15 Fri","file":"1 - daily notes/2026-05-15 Fri.md","line":9,"url":null,"capturedAt":"2026-05-15"},"useful":0,"drawn":0,"lastDrawn":null,"state":"active","createdAt":"2026-08-27T07:10:38+00:00","updatedAt":"2026-08-27T07:10:38+00:00"},{"id":"sp_ba787399","text":"new choice importantly maintains spontaneity. It doesn't try to enforce a particular choice. Even if one is naturally close at hand","tags":["agency"],"source":{"origin":"obsidian","note":"2026-05-20 Wed","file":"1 - daily notes/2026-05-20 Wed.md","line":11,"url":null,"capturedAt":" const DEFAULTS = { drawCount:1, include:[], exclude:[], noRepeat:12, sort:'recent' };
const STRUCTURAL = ['question','whisper','de','needs-review'];

let doc, S;           // document + settings
let recent = [];      // ids drawn recently (no-repeat window)
let cooling = false;
const COOL_MS = 6000;

function boot(){
  doc = Store.load();
  if(!doc || !Array.isArray(doc.spells) || !doc.spells.length){
    doc = { version:1, exportedAt:new Date().toISOString(), settings:{...DEFAULTS}, spells:SEED.map(s=>({...s})) };
    Store.save(doc);
  }
  doc.settings = Object.assign({}, DEFAULTS, doc.settings || {});
  S = doc.settings;
  renderAll();
}
function persist(){
  doc.exportedAt = new Date().toISOString();
  Store.save(doc);
}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const active = () => doc.spells.filter(s => s.state === 'active');
const buried = () => doc.spells.filter(s => s.state === 'graveyard');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid = () => 'sp_' + Math.random().toString(16).slice(2,10);
const now = () => new Date().toISOString();

function fmt(text){
  return esc(text)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/==(.+?)==/g, '<i class="mk">$1</i>');
}
function sizeClass(t){
  const n = t.replace(/[*=]/g,'').length;
  return n < 46 ? 'lg' : n > 300 ? 'sm' : '';
}
function toast(msg){
  const old = $('#toast'); if(old) old.remove();
  const el = document.createElement('div');
  el.id = 'toast'; el.textContent = msg;
  if(document.querySelector('.sheet')) el.classList.add('high');
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2100);
}
function buzz(ms){ if(navigator.vibrate) try{ navigator.vibrate(ms); }catch(e){} }

function allTags(){
  const c = new Map();
  for(const s of doc.spells){ if(s.state!=='active') continue;
    for(const t of s.tags) c.set(t, (c.get(t)||0)+1); }
  return [...c.entries()].sort((a,b)=> b[1]-a[1] || a[0].localeCompare(b[0]));
}

/* =========================================================================
   Drawing
   ========================================================================= */
function pool(){
  let p = active();
  if(S.include.length) p = p.filter(s => S.include.some(t => s.tags.includes(t)));
  if(S.exclude.length) p = p.filter(s => !S.exclude.some(t => s.tags.includes(t)));
  return p;
}
function pick(n){
  let p = pool();
  if(!p.length) return [];
  const fresh = p.filter(s => !recent.includes(s.id));
  if(fresh.length >= n) p = fresh;
  const out = [];
  const bag = p.slice();
  while(out.length < Math.min(n, bag.length + out.length) && bag.length){
    out.push(bag.splice(Math.floor(Math.random()*bag.length), 1)[0]);
  }
  recent = [...out.map(s=>s.id), ...recent].slice(0, S.noRepeat);
  return out;
}

function cast(){
  if(cooling){
    const w = $('#sigilWrap');
    w.classList.remove('denied'); void w.offsetWidth; w.classList.add('denied');
    return;
  }
  const p = pool();
  if(!p.length){
    toast(active().length ? 'Nothing matches those filters' : 'The book is empty');
    return;
  }
  cooling = true;
  const wrap = $('#sigilWrap'), label = $('#castLabel'), res = $('#results'), scr = $('#draw');
  buzz(12);
  res.innerHTML = '';
  scr.classList.remove('revealed');
  wrap.classList.add('casting');
  label.classList.remove('ready');
  label.textContent = 'gathering';

  setTimeout(()=>{
    wrap.classList.add('spent');
    setTimeout(()=>{
      const drawn = pick(S.drawCount);
      for(const s of drawn){ s.drawn++; s.lastDrawn = now(); }
      persist();
      res.innerHTML = '<div class="inner">' + drawn.map((s,i)=>card(s,{delay:i*130})).join('') + '</div>';
      wrap.classList.remove('casting','spent');
      scr.classList.add('revealed');
      res.scrollTop = 0;
      buzz(18);
      recharge();
    }, 420);
  }, 900);
}

function recharge(){
  const ring = $('#recharge'), label = $('#castLabel');
  label.textContent = 'reinscribing';
  ring.classList.remove('run'); void ring.offsetWidth; ring.classList.add('run');
  setTimeout(()=>{
    cooling = false;
    ring.classList.remove('run');
    label.textContent = 'cast again';
    label.classList.add('ready');
  }, COOL_MS);
}

/* =========================================================================
   Card rendering
   ========================================================================= */
function card(s, opt={}){
  const o = Object.assign({delay:0, from:'draw', open:false}, opt);
  return `
  <article class="card${o.delay!==undefined?' rise':''}" style="animation-delay:${o.delay}ms" data-id="${s.id}">
    <p class="spell ${sizeClass(s.text)}">${fmt(s.text)}</p>
    ${s.tags.length ? `<div class="tags">${s.tags.map(t=>
      `<button class="tag${STRUCTURAL.includes(t)?' brass':''}" data-act="tag" data-tag="${esc(t)}">${esc(t)}</button>`).join('')}</div>` : ''}
    <div class="actions">
      <button class="act${s.useful?' on':''}" data-act="useful">
        <svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.7-7.5-10a4.2 4.2 0 017.5-2.6A4.2 4.2 0 0119.5 10.5c0 5.3-7.5 10-7.5 10z"/></svg>
        <span class="n">${s.useful || 'useful'}</span>
      </button>
      <button class="act" data-act="source">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
      </button>
      <button class="act right" data-act="bury">
        <svg viewBox="0 0 24 24"><path d="M5 21V10a7 7 0 0114 0v11"/><path d="M12 21v-8M9 13h6"/></svg>
      </button>
    </div>
    <div class="source hide">${sourceHtml(s)}</div>
  </article>`;
}

function sourceHtml(s){
  const src = s.source || {};
  const rows = [];
  const origin = {obsidian:'Obsidian vault', manual:'Written here', import:'Imported'}[src.origin] || src.origin || 'unknown';
  rows.push(['Origin', esc(origin)]);
  if(src.capturedAt) rows.push(['Captured', esc(src.capturedAt)]);
  else if(src.note) rows.push(['Note', esc(src.note)]);
  if(src.note && src.capturedAt && !src.note.startsWith(src.capturedAt)) rows.push(['Note', esc(src.note)]);
  if(src.file) rows.push(['File', esc(src.file) + (src.line ? ':' + src.line : '')]);
  if(src.url) rows.push(['Link', `<a href="${esc(src.url)}" target="_blank" rel="noreferrer">${esc(src.url)}</a>`]);
  rows.push(['Drawn', s.drawn === 1 ? 'once' : s.drawn + ' times']);
  rows.push(['Useful', s.useful === 1 ? 'once' : s.useful + ' times']);
  return rows.map(([k,v])=>`<div><dt>${k}</dt><dd style="margin:0">${v}</dd></div>`).join('')
    + `<div style="margin-top:11px;gap:6px"><button class="tag" data-act="edit">edit spell</button></div>`;
}

/* card interactions (delegated) */
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if(!btn) return;
  const cardEl = btn.closest('.card');
  const act = btn.dataset.act;

  if(act === 'tag'){ openTag(btn.dataset.tag); return; }
  if(!cardEl) return;
  const s = doc.spells.find(x => x.id === cardEl.dataset.id);
  if(!s) return;

  if(act === 'useful'){
    s.useful++; s.updatedAt = now(); persist(); buzz(10);
    btn.classList.add('on');
    btn.querySelector('.n').textContent = s.useful;
    refreshQuiet();
  }
  if(act === 'source'){
    const box = cardEl.querySelector('.source');
    if(box.classList.contains('hide')) box.innerHTML = sourceHtml(s);
    box.classList.toggle('hide');
    btn.classList.toggle('on');
  }
  if(act === 'bury'){
    s.state = 'graveyard'; s.updatedAt = now(); persist();
    cardEl.style.transition = 'opacity .3s, transform .3s';
    cardEl.style.opacity = 0; cardEl.style.transform = 'scale(.97)';
    setTimeout(()=>{ cardEl.remove(); refreshQuiet(); }, 300);
    toast('Sent to the graveyard');
  }
  if(act === 'edit'){ editSpell(s); }
});

/* =========================================================================
   Filters
   ========================================================================= */
function filterSummary(){
  const inc = S.include.length, exc = S.exclude.length;
  if(!inc && !exc) return 'All ' + pool().length + ' spells';
  const bits = [];
  if(inc) bits.push('only ' + S.include.join(', '));
  if(exc) bits.push('never ' + S.exclude.join(', '));
  return bits.join(' · ');
}
function renderFilterBar(){
  const n = pool().length;
  $('#filterbar').innerHTML = `
    <button class="chip${(S.include.length||S.exclude.length)?' on':''}" id="filterChip">
      <svg viewBox="0 0 24 24"><path d="M3 5h18M6 12h12M10 19h4"/></svg>
      ${esc(filterSummary())}
    </button>
    <div class="seg" style="margin-left:auto">
      ${[1,2,3].map(n=>`<button data-n="${n}" class="${S.drawCount===n?'on':''}">${n}</button>`).join('')}
    </div>`;
  $('#filterChip').onclick = openFilters;
  $('#filterbar').querySelectorAll('[data-n]').forEach(b => b.onclick = () => {
    S.drawCount = +b.dataset.n; persist(); renderFilterBar();
  });
}

function openFilters(){
  const tags = allTags();
  sheet('Filter the draw', `
    <p class="help" style="margin:2px 0 4px">Tap once to require a tag, twice to banish it.
    Filters stay put between sessions.</p>
    <div class="taggrid" id="fTags">
      ${tags.map(([t,n])=>{
        const on = S.include.includes(t), off = S.exclude.includes(t);
        return `<button class="tagbtn" data-t="${esc(t)}" style="${on?'border-color:var(--brass);':off?'opacity:.4;border-style:dashed;':''}">
          <span class="nm" style="${on?'color:var(--brass)':off?'text-decoration:line-through':''}">${esc(t)}</span>
          <span class="ct">${n}</span></button>`;
      }).join('')}
    </div>
    <div style="font-size:13px;color:var(--dim);text-align:center;padding:4px 0" id="fCount"></div>
    <button class="btn ghost" id="fClear">Clear all filters</button>
    <button class="btn" id="fDone">Done</button>
  `, () => {});

  const upd = () => {
    $('#fCount').textContent = pool().length + ' spells in the pool';
  };
  upd();
  $('#fTags').querySelectorAll('[data-t]').forEach(b => b.onclick = () => {
    const t = b.dataset.t;
    if(S.include.includes(t)){ S.include = S.include.filter(x=>x!==t); S.exclude.push(t); }
    else if(S.exclude.includes(t)){ S.exclude = S.exclude.filter(x=>x!==t); }
    else S.include.push(t);
    persist();
    const on = S.include.includes(t), off = S.exclude.includes(t);
    b.style.borderColor = on ? 'var(--brass)' : ''; b.style.opacity = off ? .4 : 1;
    b.style.borderStyle = off ? 'dashed' : 'solid';
    b.querySelector('.nm').style.color = on ? 'var(--brass)' : '';
    b.querySelector('.nm').style.textDecoration = off ? 'line-through' : 'none';
    upd();
  });
  $('#fClear').onclick = () => { S.include = []; S.exclude = []; persist(); closeSheet(); renderAll(); };
  $('#fDone').onclick = () => { closeSheet(); renderAll(); };
}

/* =========================================================================
   Library
   ========================================================================= */
let libTag = null, libGrave = false;
const SORTS = {recent:'Recent', useful:'Most useful', drawn:'Most drawn', az:'A–Z'};

function renderLibrary(){
  const q = ($('#search').value || '').trim().toLowerCase();
  let list = libGrave ? buried() : active();
  if(libTag) list = list.filter(s => s.tags.includes(libTag));
  if(q) list = list.filter(s => s.text.toLowerCase().includes(q) || s.tags.some(t=>t.includes(q)));

  list = list.slice().sort((a,b)=>{
    if(S.sort==='useful') return b.useful-a.useful || b.drawn-a.drawn;
    if(S.sort==='drawn') return b.drawn-a.drawn;
    if(S.sort==='az') return a.text.localeCompare(b.text);
    return (b.source?.capturedAt||'').localeCompare(a.source?.capturedAt||'');
  });

  $('#libTitle').textContent = libGrave ? 'Graveyard' : libTag ? libTag : 'The book';
  $('#libCount').textContent = list.length + (list.length===1?' spell':' spells');

  $('#libFilter').innerHTML = `
    ${libTag ? `<button class="chip on" id="clearTag">${esc(libTag)} <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>` : ''}
    ${libGrave ? `<button class="chip on" id="clearGrave">graveyard <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>` : ''}
    <button class="chip" id="sortChip">${SORTS[S.sort]}</button>`;
  const ct = $('#clearTag'); if(ct) ct.onclick = () => { libTag=null; renderLibrary(); };
  const cg = $('#clearGrave'); if(cg) cg.onclick = () => { libGrave=false; renderLibrary(); };
  $('#sortChip').onclick = () => {
    const k = Object.keys(SORTS); S.sort = k[(k.indexOf(S.sort)+1)%k.length]; persist(); renderLibrary();
  };

  if(!list.length){
    $('#libList').innerHTML = `<div class="empty"><b>${q?'Nothing found':libGrave?'The graveyard is empty':'No spells here'}</b>
      ${q?'Try a different word.':libGrave?'Nothing has been buried yet.':'Add one from the Vault.'}</div>`;
    return;
  }
  $('#libList').innerHTML = list.map(s => {
    let t = esc(s.text.replace(/[*=]/g,''));
    if(q){ const i = t.toLowerCase().indexOf(q);
      if(i>=0) t = t.slice(0,i)+'<span class="hit">'+t.slice(i,i+q.length)+'</span>'+t.slice(i+q.length); }
    return `<button class="row${libGrave?' gone':''}" data-open="${s.id}">
      <div class="t">${t}</div>
      <div class="m">
        ${s.useful?`<span class="mt">♥ ${s.useful}</span>`:''}
        ${s.drawn?`<span>drawn ${s.drawn}×</span>`:''}
        <span>${esc(s.tags.slice(0,4).join(' · '))}</span>
      </div></button>`;
  }).join('');
  $('#libList').querySelectorAll('[data-open]').forEach(b =>
    b.onclick = () => openSpell(doc.spells.find(s=>s.id===b.dataset.open)));
}

function openSpell(s){
  if(!s) return;
  const grave = s.state === 'graveyard';
  sheet('Spell', `<div id="sheetCard">${card(s,{delay:undefined})}</div>
    <button class="btn ghost" id="spEdit">Edit</button>
    <button class="btn ${grave?'':'danger'}" id="spGrave">${grave?'Restore to the book':'Move to graveyard'}</button>`);
  $('#sheetCard .card').classList.remove('rise');
  $('#spEdit').onclick = () => { closeSheet(); editSpell(s); };
  $('#spGrave').onclick = () => {
    s.state = grave ? 'active' : 'graveyard'; s.updatedAt = now(); persist();
    closeSheet(); renderAll(); toast(grave ? 'Back in the book' : 'Sent to the graveyard');
  };
}

function openTag(t){
  libTag = t; libGrave = false; $('#search').value = '';
  closeSheet(); go('library');
}

/* =========================================================================
   Tags screen
   ========================================================================= */
function renderTags(){
  const tags = allTags();
  $('#tagCount').textContent = tags.length + ' tags';
  $('#tagGrid').innerHTML = tags.map(([t,n]) =>
    `<button class="tagbtn${STRUCTURAL.includes(t)?' struct':''}" data-t="${esc(t)}">
      <span class="nm">${esc(t)}</span><span class="ct">${n}</span></button>`).join('')
    || `<div class="empty"><b>No tags yet</b>Tags appear as you add them to spells.</div>`;
  $('#tagGrid').querySelectorAll('[data-t]').forEach(b => b.onclick = () => openTag(b.dataset.t));
}

/* =========================================================================
   Vault
   ========================================================================= */
function renderVault(){
  const a = active().length, g = buried().length;
  const untagged = active().filter(s => !s.tags.some(t=>!STRUCTURAL.includes(t))).length;
  $('#vaultBody').innerHTML = `
    <button class="item" id="vAdd">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      <span class="lab">Write a spell<span class="s">Add one by hand</span></span></button>

    <button class="item" id="vTriage">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h6"/><path d="M17 15l2.5 2.5L23 14" style="stroke:var(--brass)"/></svg>
      <span class="lab">Triage<span class="s">Walk the book one spell at a time</span></span>
      <span class="val">${a}</span></button>

    <button class="item" id="vGrave">
      <svg viewBox="0 0 24 24"><path d="M5 21V10a7 7 0 0114 0v11"/><path d="M12 21v-8M9 13h6"/></svg>
      <span class="lab">Graveyard<span class="s">Buried, not burned</span></span>
      <span class="val">${g}</span></button>

    <div class="group"><span class="eyebrow">The draw</span>
      <div class="item" style="cursor:default">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></svg>
        <span class="lab">Spells per cast</span>
        <div class="seg">${[1,2,3].map(n=>`<button data-dc="${n}" class="${S.drawCount===n?'on':''}">${n}</button>`).join('')}</div>
      </div>
      <button class="item" id="vFilters">
        <svg viewBox="0 0 24 24"><path d="M3 5h18M6 12h12M10 19h4"/></svg>
        <span class="lab">Filters<span class="s">${esc(filterSummary())}</span></span></button>
    </div>

    <div class="group"><span class="eyebrow">Keeping</span>
      <button class="item" id="vExport">
        <svg viewBox="0 0 24 24"><path d="M12 3v12M8 11l4 4 4-4"/><path d="M4 17v3h16v-3"/></svg>
        <span class="lab">Export the book<span class="s">A JSON file — your backup</span></span></button>
      <button class="item" id="vImport">
        <svg viewBox="0 0 24 24"><path d="M12 15V3M8 7l4-4 4 4"/><path d="M4 17v3h16v-3"/></svg>
        <span class="lab">Import spells<span class="s">Merges by id, never overwrites counts</span></span></button>
    </div>

    <div class="group"><span class="eyebrow">The book holds</span>
      <div class="item" style="cursor:default"><svg viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 015.5 4H10v16H5.5A1.5 1.5 0 014 18.5z"/><path d="M20 5.5A1.5 1.5 0 0018.5 4H14v16h4.5a1.5 1.5 0 001.5-1.5z"/></svg>
        <span class="lab">${a} spells<span class="s">${untagged} without a meaning tag · ${allTags().length} tags · ${active().reduce((n,s)=>n+s.useful,0)} marks of use</span></span></div>
    </div>
    ${Bridge ? '' : `<div class="banner">Preview mode. There's no storage bridge here, so anything you
      change lives in this tab only and vanishes on reload. Inside the Android shell it writes to a real file.</div>`}
    <input type="file" id="fileIn" accept=".json,application/json" class="hide">`;

  $('#vAdd').onclick = () => editSpell(null);
  $('#vTriage').onclick = triage;
  $('#vGrave').onclick = () => { libGrave = true; libTag = null; $('#search').value=''; go('library'); };
  $('#vFilters').onclick = openFilters;
  $('#vExport').onclick = exportBook;
  $('#vImport').onclick = () => $('#fileIn').click();
  $('#fileIn').onchange = importBook;
  $('#vaultBody').querySelectorAll('[data-dc]').forEach(b => b.onclick = () => {
    S.drawCount = +b.dataset.dc; persist(); renderVault(); renderFilterBar();
  });
}

/* ---------- add / edit ---------- */
function editSpell(s, after){
  const isNew = !s;
  const known = allTags().map(t=>t[0]);
  const cur = new Set(s ? s.tags : []);
  sheet(isNew ? 'Write a spell' : 'Edit spell', `
    <div class="field"><label>The spell</label>
      <textarea id="eText" placeholder="What do you want to remember?">${s?esc(s.text):''}</textarea></div>
    <div class="field"><label>Tags</label>
      <div class="taggrid" id="eTags" style="padding:0 0 10px">
        ${known.map(t=>`<button class="tagbtn" data-t="${esc(t)}"
          style="${cur.has(t)?'border-color:var(--brass)':''}">
          <span class="nm" style="${cur.has(t)?'color:var(--brass)':''}">${esc(t)}</span></button>`).join('')}
      </div>
      <input id="eNew" placeholder="New tag, then Enter" autocomplete="off">
    </div>
    <button class="btn" id="eSave">${isNew?'Add to the book':'Save'}</button>
    ${isNew?'':'<button class="btn ghost" id="eCancel">Cancel</button>'}
  `, null, !!after);
  const wire = b => b.onclick = () => {
    const t = b.dataset.t;
    if(cur.has(t)) cur.delete(t); else cur.add(t);
    b.style.borderColor = cur.has(t)?'var(--brass)':'';
    b.querySelector('.nm').style.color = cur.has(t)?'var(--brass)':'';
  };
  $('#eTags').querySelectorAll('[data-t]').forEach(wire);
  $('#eNew').onkeydown = e => {
    if(e.key !== 'Enter') return;
    e.preventDefault();
    const t = e.target.value.trim().toLowerCase().replace(/\s+/g,'-');
    if(!t) return;
    cur.add(t); e.target.value = '';
    if(!$(`#eTags [data-t="${t}"]`)){
      const b = document.createElement('button');
      b.className='tagbtn'; b.dataset.t=t; b.style.borderColor='var(--brass)';
      b.innerHTML = `<span class="nm" style="color:var(--brass)">${esc(t)}</span>`;
      $('#eTags').appendChild(b); wire(b);
    }
  };
  $('#eSave').onclick = () => {
    const text = $('#eText').value.trim();
    if(!text){ toast('A spell needs words'); return; }
    if(isNew){
      doc.spells.unshift({ id:uid(), text, tags:[...cur].sort(), useful:0, drawn:0, lastDrawn:null,
        state:'active', createdAt:now(), updatedAt:now(),
        source:{origin:'manual', note:null, file:null, line:null, url:null, capturedAt:now().slice(0,10)} });
      toast('Written into the book');
    } else {
      s.text = text; s.tags = [...cur].sort(); s.updatedAt = now();
      toast('Saved');
    }
    persist();
    if(after){ after(); return; }
    closeSheet(); renderAll();
  };
  const c = $('#eCancel'); if(c) c.onclick = () => after ? after() : closeSheet();
}

/* ---------- triage ---------- */
function triage(){
  const queue = active().slice().sort((a,b)=>
    (a.tags.filter(t=>!STRUCTURAL.includes(t)).length) - (b.tags.filter(t=>!STRUCTURAL.includes(t)).length));
  let i = 0;
  const step = () => {
    if(i >= queue.length){ closeSheet(); renderAll(); toast('Book walked'); return; }
    const s = queue[i];
    sheet('Triage', `
      <div class="progress"><i style="width:${(i/queue.length*100).toFixed(1)}%"></i></div>
      <p class="spell ${sizeClass(s.text)}" style="margin:20px 0 14px">${fmt(s.text)}</p>
      <div class="tags">${s.tags.map(t=>`<span class="tag${STRUCTURAL.includes(t)?' brass':''}">${esc(t)}</span>`).join('') || '<span class="tag">untagged</span>'}</div>
      <div style="font-size:12px;color:var(--dim);line-height:1.6">
        ${esc(s.source?.capturedAt || s.source?.note || 'no date')}${s.drawn?' · drawn '+s.drawn+'×':''}${s.useful?' · useful '+s.useful+'×':''}
        ${s.source?.url?`<br><a href="${esc(s.source.url)}" target="_blank" rel="noreferrer" style="color:var(--brass);word-break:break-all">${esc(s.source.url)}</a>`:''}
      </div>
      <div class="triage-bar">
        <button class="keep" id="tKeep">Keep</button>
        <button id="tEdit">Edit</button>
        <button id="tBury">Bury</button>
      </div>
      <div style="text-align:center;font-size:12px;color:var(--dim);padding-top:12px">
        ${i+1} of ${queue.length}</div>`, null, true);
    $('#tKeep').onclick = () => { i++; step(); };
    $('#tBury').onclick = () => { s.state='graveyard'; s.updatedAt=now(); persist(); i++; step(); };
    $('#tEdit').onclick = () => { editSpell(s, () => step()); };
  };
  step();
}

/* ---------- import / export ---------- */
function exportBook(){
  const data = JSON.stringify({version:1, exportedAt:now(), settings:S, spells:doc.spells}, null, 2);
  const name = 'spellbook-' + now().slice(0,10) + '.json';
  if(Bridge && Bridge.export){
    try{ const where = Bridge.export(name, data); toast('Saved to ' + (where || 'Downloads')); return; }
    catch(e){ console.warn(e); }
  }
  const url = URL.createObjectURL(new Blob([data], {type:'application/json'}));
  const a = document.createElement('a'); a.href = url; a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  toast('Exported ' + doc.spells.length + ' spells');
}

function importBook(e){
  const file = e.target.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    let incoming;
    try{
      const parsed = JSON.parse(r.result);
      incoming = Array.isArray(parsed) ? parsed : parsed.spells;
      if(!Array.isArray(incoming)) throw 0;
    }catch(err){ toast("That file isn't a spellbook"); return; }

    const byId = new Map(doc.spells.map(s=>[s.id, s]));
    let added = 0, merged = 0;
    for(const raw of incoming){
      const text = (raw.text || '').trim();
      if(!text) continue;
      const id = raw.id || uid();
      const ex = byId.get(id);
      if(ex){
        ex.text = text;
        ex.tags = [...new Set([...ex.tags, ...(raw.tags||[])])].sort();
        if(raw.source) ex.source = Object.assign({}, raw.source, {origin: ex.source?.origin || raw.source.origin});
        ex.updatedAt = now();
        merged++;                       // counts and state deliberately untouched
      } else {
        const s = {
          id, text, tags:(raw.tags||[]).slice().sort(),
          useful:raw.useful||0, drawn:raw.drawn||0, lastDrawn:raw.lastDrawn||null,
          state:raw.state==='graveyard'?'graveyard':'active',
          createdAt:raw.createdAt||now(), updatedAt:now(),
          source:raw.source || {origin:'import', note:null, file:null, line:null, url:null, capturedAt:null}
        };
        doc.spells.push(s); byId.set(id, s); added++;
      }
    }
    persist(); renderAll();
    toast(`${added} new, ${merged} updated`);
  };
  r.readAsText(file);
  e.target.value = '';
}

/* =========================================================================
   Sheet
   ========================================================================= */
function sheet(title, html, onClose, keep){
  if(!keep) closeSheet();
  else { const b = document.querySelector('.sheet .body'); if(b){ b.innerHTML = html; return; } closeSheet(); }
  const scrim = document.createElement('div');
  scrim.className = 'scrim'; scrim.onclick = closeSheet;
  const el = document.createElement('div');
  el.className = 'sheet';
  el.innerHTML = `<div class="grab"></div>
    <div class="top"><span class="eyebrow">${esc(title)}</span>
    <button class="act" onclick="closeSheet()"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="body">${html}</div>`;
  document.body.append(scrim, el);
  sheet._onClose = onClose;
}
function closeSheet(){
  document.querySelectorAll('.scrim,.sheet').forEach(n=>n.remove());
  if(sheet._onClose){ const f = sheet._onClose; sheet._onClose = null; f(); }
}
window.closeSheet = closeSheet;

/* =========================================================================
   Navigation
   ========================================================================= */
function go(tab){
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('hide', s.id !== tab));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  if(tab === 'library') renderLibrary();
  if(tab === 'tags') renderTags();
  if(tab === 'vault') renderVault();
  if(tab === 'draw') renderFilterBar();
  document.querySelector('#'+tab).scrollTop = 0;
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  if(b.dataset.tab === 'library' && !$('#library').classList.contains('hide')){ libTag=null; libGrave=false; $('#search').value=''; }
  go(b.dataset.tab);
});

function renderAll(){
  renderFilterBar();
  if(!$('#library').classList.contains('hide')) renderLibrary();
  if(!$('#tags').classList.contains('hide')) renderTags();
  if(!$('#vault').classList.contains('hide')) renderVault();
}
function refreshQuiet(){
  if(!$('#library').classList.contains('hide')) renderLibrary();
  renderFilterBar();
}

/* Android hardware back: unwind one layer at a time, and only leave the app
   from the draw screen with nothing open. Returns true if we handled it. */
window.appBack = function(){
  if(document.querySelector('.sheet')){ closeSheet(); return true; }
  const lib = $('#library');
  if(!lib.classList.contains('hide') && (libTag || libGrave || $('#search').value)){
    libTag = null; libGrave = false; $('#search').value = ''; renderLibrary(); return true;
  }
  const open = [...document.querySelectorAll('.screen')].find(s => !s.classList.contains('hide'));
  if(open && open.id !== 'draw'){ go('draw'); return true; }
  return false;
};

$('#sigilBtn').onclick = cast;
$('#search').oninput = renderLibrary;
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeSheet(); });

boot();
</script>
